<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillSwap App Prototype</title>
<meta name="description" content="High-fidelity SkillSwap prototype: swap or buy unused hobby materials with people nearby.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{
  --bg:#FAF7F2;--soft:#FFFDF9;--fill:#F2ECE3;--hair:#E8E1D6;--lilac:#ECE6F6;--sage:#E2ECDF;--sand:#F7ECCF;--peach:#FBE4D8;--sky:#DFEBF2;--rose:#F7E1E6;--deep:#17302A;--serif:"Fraunces",Georgia,serif;--card:#FFFFFF;--ink:#101413;--muted:#6A706D;--line:#ECEDEA;
  --green:#17302A;--green-2:#17302A;--green-soft:#F1EEE9;--ok:#17302A;--ok-soft:#F1EEE9;--accent:#C4532F;--accent-2:#9A3D20;--accent-soft:#FBE6DB;
  --coral:#EE7A58;--coral-soft:#FCE6DD;--butter:#F5C447;--butter-soft:#FFF3D3;--red:#B3261E;--red-soft:#FBE3DE;
  --r-lg:22px;--r-md:14px;--shadow:0 1px 2px rgba(16,20,19,.04),0 10px 30px -14px rgba(16,20,19,.18);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#E9EBE8;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.device{position:relative;width:100%;height:100dvh;overflow:hidden;overflow:clip;background:var(--bg)}
@media (min-width:520px) and (min-height:640px){
  body{display:grid;place-items:center;min-height:100dvh;padding:24px}
  .device{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:44px;box-shadow:0 0 0 10px #1b221f,0 0 0 11px #36403b,0 40px 80px -20px rgba(27,36,32,.45)}
}
body.embed{background:var(--bg);padding:0;display:block}
body.embed .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}

.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:14px 0 112px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.notab{padding-bottom:180px}
.screen.in{animation:in .34s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:back .34s cubic-bezier(.2,.8,.2,1)}
.screen.fade{animation:fade .25s ease}
@keyframes in{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes back{from{transform:translateX(-24%);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.pad{padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;min-height:56px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.035em;margin:0}
.nav{position:sticky;top:-14px;z-index:6;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 14px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .t{text-align:center;font-weight:700;font-size:16px}
.nav .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib.w{background:#fff;box-shadow:0 0 0 1px var(--hair)}.ib.g{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ib svg{width:22px;height:22px}
.h2{display:flex;justify-content:space-between;align-items:center;margin:28px 20px 12px}
.h2 b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.h2 button{font-size:14px;font-weight:700;color:var(--green)}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
svg.i{width:20px;height:20px;flex:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:999px;font-weight:700;font-size:16px;transition:transform .15s,opacity .2s}
.btn:active,.li:active .ph,.chip:active,.opt:active{transform:scale(.97)}
.btn.p{background:var(--deep);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.s{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.btn.d{background:var(--red-soft);color:var(--red)}
.btn.t{background:none;color:var(--muted);height:44px;font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:12px 20px calc(20px + env(safe-area-inset-bottom));background:var(--bg);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border-top:1px solid var(--line);display:grid;gap:8px}
.dock .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tabs{position:absolute;left:14px;right:14px;bottom:16px;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:68px;padding:0 6px;border-radius:34px;background:rgba(255,255,255,.74);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:0 0 0 1px rgba(16,20,19,.06),0 14px 34px -10px rgba(16,20,19,.28)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#8D9390;position:relative}
.tabs button.on{color:var(--ink)}.tabs button.on svg{stroke-width:2.4}
.tabs .post{width:50px;height:50px;margin:0 auto;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(109,74,255,.85);padding:0}
.tabs .post svg{width:26px;height:26px}
.tabs .badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--fill)}
.seg button{height:38px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button{transition:background .2s,color .2s}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06)}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.sw{background:var(--green-soft);color:var(--green-2)}.md .tag{background:rgba(255,255,255,.8);backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);color:var(--ink)}
.tag.buy{background:var(--soft);color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:var(--green-2)}
.tag.wait{background:var(--soft);color:var(--muted)}
.tag.no{background:var(--red-soft);color:var(--red)}

/* search */
.search{display:flex;align-items:center;gap:10px;margin:8px 20px 14px;height:52px;padding:0 6px 0 16px;border-radius:26px;background:#fff;box-shadow:0 1px 2px rgba(16,20,19,.05),0 0 0 1px var(--hair)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.search .fb{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;position:relative}
.search .fb i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.loc{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.loc b{color:var(--ink)}

/* listing grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:0 20px}
.li{position:relative;text-align:left;display:block}
.li .ph{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--fill);transition:transform .2s}
.art{width:100%;height:100%;display:block;object-fit:cover}
.li .hv{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center}
.li .hv svg{width:18px;height:18px}
.li .hv.on svg{fill:var(--accent);stroke:var(--accent)}
.li .md{position:absolute;left:10px;bottom:10px;display:flex;gap:4px}
.li b{display:block;font-size:14.5px;font-weight:650;margin:10px 2px 3px;line-height:1.3;letter-spacing:-.01em}
.li small{display:block;font-size:12.5px;color:var(--muted);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{margin:24px 20px;padding:32px 22px;border-radius:20px;background:var(--soft);text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* listing detail */
.hero{position:relative;margin:0 20px;border-radius:24px;overflow:hidden;aspect-ratio:1.15}.hero.full{margin:-14px 0 0;border-radius:0 0 30px 30px;aspect-ratio:auto;height:430px}.hero .hb{position:absolute;top:30px;left:22px;right:22px;display:flex;justify-content:space-between}

.hero .live{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);font-size:12.5px;font-weight:700}
.hero .live svg{width:15px;height:15px;color:var(--green)}
.ttl{margin:22px 20px 0}
.ttl h2{margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.ttl .tg{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 20px 0;border-radius:18px;background:var(--soft)}
.facts div{padding:14px 10px;text-align:center}
.facts div+div{border-left:1px solid var(--hair)}
.facts small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.facts b{font-size:14px}
.sec{margin:24px 20px 0;font-size:15px;line-height:1.6}
.sec h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 10px}
.want{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--green-soft);color:var(--green-2);font-size:15px;font-weight:600;line-height:1.45}
.who{display:flex;align-items:center;gap:12px;margin:20px 20px 0;padding:14px 16px;border-radius:20px;background:var(--soft)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
.who .n{flex:1;min-width:0}
.who .n b{display:block;font-size:15.5px}
.who .n span{font-size:13px;color:var(--muted)}.who .av{width:44px;height:44px}
.trust{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--green)}
.trust svg{width:15px;height:15px}

/* forms */
.fld{margin:20px 20px 0}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.fld input,.fld textarea{width:100%;border:0;outline:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .2s,background .2s;padding:14px 15px;font-size:15.5px;resize:none}
.fld input:focus,.fld textarea:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--green)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--soft);box-shadow:inset 0 0 0 1.5px transparent;text-align:left;margin-top:10px;transition:box-shadow .2s,background .2s,transform .15s}
.opt.on{box-shadow:inset 0 0 0 2px var(--green);background:#fff}
.opt .ra{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #C9CFCB;flex:none;display:grid;place-items:center}
.opt.on .ra{box-shadow:inset 0 0 0 7px var(--green)}
.opt .ck{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px #C9CFCB;flex:none;display:grid;place-items:center;color:#fff}
.opt.on .ck{background:var(--green);box-shadow:none}
.opt .ck svg{width:15px;height:15px}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:15px;margin-bottom:2px}
.opt .tx span{font-size:13px;color:var(--muted)}
.opt .th{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none}

.note{display:flex;gap:10px;margin:18px 20px 0;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:14px;line-height:1.5;color:var(--muted)}.note svg{color:var(--green)}.note b{color:var(--ink)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.g{background:var(--green-soft);color:var(--green-2)}.note.g b{color:var(--green-2)}

/* review */
.rev{margin:20px 20px 0;padding:4px 16px;border-radius:20px;background:var(--soft)}
.rev div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;font-size:15px}
.rev div+div{border-top:1px solid var(--hair)}
.rev span{color:var(--muted)}
.rev b{text-align:right}
.swaprow{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:10px;margin:16px 20px 0}
.swaprow .it{text-align:center}
.swaprow .it .th{aspect-ratio:1;border-radius:20px;overflow:hidden}

.swaprow .it b{display:block;font-size:13.5px;margin-top:10px;line-height:1.3}
.swaprow .it small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.swaprow .ar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.swaprow .ar svg{width:18px;height:18px}

/* timeline */
.steps{margin:24px 20px 0;padding:0}
.steps div{position:relative;display:flex;gap:12px;padding:0 0 18px}
.steps div:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}
.steps div.sd:not(:last-child):before{background:var(--ok)}
.steps i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-style:normal;font-size:12px;font-weight:800}
.steps .sd i{background:var(--ok);color:#fff}
.steps .sn i{background:var(--green);color:#fff;box-shadow:0 0 0 5px var(--green-soft)}
.steps i svg{width:14px;height:14px}
.steps b{display:block;font-size:15px}
.steps span{font-size:13.5px;color:var(--muted);line-height:1.45}

/* list rows */
.rows{margin:0 20px;border-radius:20px;background:var(--soft);overflow:hidden}
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.rw+.rw{border-top:1px solid var(--hair)}
.rw .th{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none}

.rw .tx{flex:1;min-width:0}
.rw .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.3}
.rw .tx span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.rw .chev{color:#A3AAA6}
.rw .ico{width:40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.rw .ico svg{width:20px;height:20px}
.mini{display:flex;gap:6px;flex:none}
.mini button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}.mini button svg{width:17px;height:17px}
.mini button.x{color:var(--red);background:var(--red-soft)}
.subtabs{display:flex;gap:8px;margin:4px 20px 18px}

/* profile */
.prof{display:flex;align-items:center;gap:16px;margin:8px 20px 0}
.prof .av{width:64px;height:64px;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(140deg,#FF9A6B,#EE5E3A)!important;box-shadow:0 8px 18px -8px rgba(238,94,58,.7)}
.prof b{display:block;font-size:20px;font-weight:700}
.prof span{font-size:13.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 20px 0}
.stats div{padding:16px 10px;border-radius:18px;background:var(--soft);text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.stats span{font-size:12.5px;color:var(--muted);font-weight:600}
.stats .g b{color:var(--green)}

/* onboarding */
.ob{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;z-index:12;color:var(--ink);padding:0 24px calc(28px + env(safe-area-inset-bottom))}
.ob .skip{position:absolute;top:16px;right:16px;z-index:2;height:38px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font-weight:700;font-size:14px}
.ob .pic{flex:1;margin:0 -24px 26px;border-radius:0 0 34px 34px;overflow:hidden;position:relative;min-height:0}.ob .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}@keyframes kb{from{transform:scale(1.08)}to{transform:none}}.ob .pic .stk{position:absolute;left:18px;bottom:18px;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;font-size:13.5px}

.ob h2{font-size:31px;line-height:1.1;font-weight:700;letter-spacing:-.04em;margin:0 0 10px}
.ob p{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.ob .dots{display:flex;gap:6px;margin:24px 0 18px}
.ob .dots i{width:8px;height:8px;border-radius:4px;background:#DADCD8;transition:width .3s,background .3s}
.ob .dots i.on{width:24px;background:var(--ink)}

.ob .btn.t{color:#fff}
.brand{display:flex;align-items:center;gap:9px;font-family:Outfit,var(--font);font-weight:800;font-size:23px;letter-spacing:-.03em}
.brand svg{width:30px;height:30px;color:var(--accent)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(15,22,19,.42);opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:21;background:#fff;border-radius:32px;padding:10px 0 calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D8DAD6;margin:0 auto 14px}
.sheet h3{margin:6px 20px 6px;font-size:21px;font-weight:700;letter-spacing:-.02em}
.sheet p.l{margin:0 20px;font-size:15px;line-height:1.5;color:var(--muted)}
.sheet .acts{display:grid;gap:8px;margin:20px 20px 0}
.range{margin:8px 20px 0}
.range input{width:100%;accent-color:var(--green)}
.range .v{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}

/* camera */
.cam{position:absolute;inset:0;z-index:15;background:#0F1412;display:flex;flex-direction:column}
.cam .vf{flex:1;position:relative;margin:56px 14px 0;border-radius:24px;overflow:hidden;background:#26302C}
.cam .vf .art{opacity:.96}
.cam .vf .gd{position:absolute;inset:0;background:linear-gradient(transparent 32%,rgba(255,255,255,.12) 33%,transparent 34%,transparent 66%,rgba(255,255,255,.12) 67%,transparent 68%),linear-gradient(90deg,transparent 32%,rgba(255,255,255,.12) 33%,transparent 34%,transparent 66%,rgba(255,255,255,.12) 67%,transparent 68%)}
.cam .tip{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}
.cam .bar{height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 20px}
.cam .bar button{color:#fff;font-weight:600;font-size:15px;width:70px}
.cam .shut{width:76px!important;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #0F1412,0 0 0 9px rgba(255,255,255,.7)}
.flash{position:absolute;inset:0;z-index:16;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .4s ease}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.photo{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin:16px 20px 0}
.photo .th{aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:var(--soft)}

.photo .th.add{box-shadow:inset 0 0 0 1.5px #D6D6D0;background:#fff;color:var(--ink)}
.photo .th.add svg{width:30px;height:30px}

/* done */
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 30px 160px}
.done .ring{width:104px;height:104px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 14px var(--ok-soft);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done .ring svg{width:52px;height:52px}
.done h2{font-size:28px;font-weight:700;letter-spacing:-.025em;margin:34px 0 8px}
.done p{font-size:15.5px;line-height:1.5;color:var(--muted);margin:0}
.done .plus{margin-top:18px;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:15px}
.done .plus b{color:var(--ok)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.toast{position:absolute;left:50%;top:66px;z-index:30;transform:translate(-50%,-12px);opacity:0;padding:11px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1}
.chat{margin:12px 20px 0;display:grid;gap:8px}
.bub{max-width:80%;padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.4;background:var(--soft);justify-self:start}
.bub.me{justify-self:end;background:var(--green);color:#fff;box-shadow:none}
.sys{justify-self:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 10px}
.help details{border-top:1px solid var(--line);padding:14px 16px}
.help details:first-child{border-top:0}
.help summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.help summary::-webkit-details-marker{display:none}
.help details p{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}

.cur{position:absolute;z-index:40;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;transition:transform .8s cubic-bezier(.45,.05,.3,1),opacity .3s;opacity:0;will-change:transform}
.cur:before{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(27,36,32,.28);box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 6px 14px rgba(0,0,0,.25)}
.cur.dn:before{animation:prs .38s ease}
@keyframes prs{50%{transform:scale(.8);box-shadow:0 0 0 2.5px #fff,0 0 0 12px rgba(23,48,42,.22)}}
.dfade{position:absolute;inset:0;z-index:39;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .45s}
.dfade.on{opacity:1}
body.demo .toast{display:none}

.rq-hd{display:flex;align-items:center;gap:14px;margin:8px 20px 0}
.rq-hd .av{width:56px;height:56px;font-size:20px}
.rq-hd h2{margin:0 0 5px;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.rq-hd .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.rq-hd .meta .trust{font-size:13.5px}
.trade{position:relative;margin:22px 20px 0;padding:4px 16px;border-radius:22px;background:var(--soft)}
.tr{display:flex;align-items:center;gap:14px;padding:14px 0}
.tr .th{width:76px;height:76px;border-radius:16px;overflow:hidden;flex:none;background:var(--fill);display:grid;place-items:center;font-weight:800;font-size:22px}
.tr small{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.tr small.get{color:var(--green)}
.tr b{display:block;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.tr .s{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.tr-div{position:relative;height:1px;background:var(--hair)}
.tr-div i{position:absolute;left:38px;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--soft)}
.tr-div i svg{width:18px;height:18px}
.dock .hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin:0 0 4px;text-align:center}
.dock .hint svg{width:15px;height:15px;color:var(--green);flex:none}
.btn.lnk{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px var(--hair)}

.rqc{display:block;width:calc(100% - 40px);margin:0 20px 12px;padding:16px;border-radius:22px;background:var(--soft);text-align:left;transition:transform .15s}
.rqc:active{transform:scale(.98)}
.rqc .top2{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.rqc .top2 .av{width:30px;height:30px;font-size:13px}
.rqc .top2 b{flex:1;min-width:0;font-size:15px}
.rqc .mid2{display:flex;align-items:center;gap:14px}
.pair{position:relative;width:96px;height:66px;flex:none}
.pair .th{position:absolute;top:0;width:62px;height:62px;border-radius:15px;overflow:hidden;box-shadow:0 0 0 3px var(--soft);background:var(--fill);display:grid;place-items:center;font-weight:800;font-size:18px}
.pair .th:first-child{left:0}.pair .th:nth-child(2){left:34px;top:4px}
.pair i{position:absolute;left:24px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--soft);z-index:2}
.pair i svg{width:14px;height:14px}
.rqc .mid2 b{display:block;font-size:15px;line-height:1.3;letter-spacing:-.01em}
.rqc .mid2 .s{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.tag.go{background:var(--accent);color:#fff}

.facts,.who,.rev,.rows,.stats div,.trade,.rqc,.opt,.note,.empty,.bub,.want{box-shadow:0 1px 2px rgba(16,20,19,.04),0 0 0 1px var(--hair)}
.opt.on{box-shadow:inset 0 0 0 2px var(--green)}
.note.g,.want{box-shadow:none}
.bub.me{box-shadow:none}
.stp{display:grid;grid-template-columns:repeat(4,1fr);padding:18px 8px 14px;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(16,20,19,.04),0 0 0 1px var(--hair)}
.stp div{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.stp div:not(:last-child):after{content:"";position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);height:2px;border-radius:2px;background:var(--fill)}
.stp div.sd:not(:last-child):after{background:var(--green)}
.stp i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:#9A9F9C}
.stp i svg{width:17px;height:17px}
.stp .sd i{background:var(--green);color:#fff}
.stp .sn i{background:#fff;color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.stp .sd,.stp .sn{color:var(--ink)}
.facts div{display:flex;flex-direction:column;align-items:center;gap:6px}
.facts div svg{width:20px;height:20px;color:var(--green)}
.facts b{font-size:14px}
.tglc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 20px}
.tglc button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--hair);text-align:left;font-weight:700;font-size:15px;transition:box-shadow .2s,transform .15s}
.tglc button svg{width:22px;height:22px;color:var(--muted)}
.tglc button.on{box-shadow:inset 0 0 0 2px var(--green)}
.tglc button.on svg{color:var(--green)}
.tglc button:active{transform:scale(.97)}
/* editorial / collage layer */
body{color:#1B211E}
.top h1,.ttl h2,.rq-hd h2,.ob h2,.done h2,.sheet h3,.h2 b,.prof b{font-family:var(--serif);font-weight:600;letter-spacing:-.02em}
.top h1{font-size:32px}
.ob h2{font-size:32px;line-height:1.08}
.chip{background:var(--soft);box-shadow:inset 0 0 0 1px var(--hair)}
.chip.on{background:var(--deep);color:#fff;box-shadow:none}
.seg{background:var(--fill)}
.tabs .post{background:var(--deep);box-shadow:0 8px 18px -8px rgba(23,48,42,.8)}
.ob .pic{margin:0 -24px 26px;border-radius:0;overflow:visible;background:none;display:grid;place-items:center;position:relative}
.ob .pic .arch{position:relative;width:min(74%,280px);height:88%;border-radius:999px 999px 28px 28px;overflow:hidden;box-shadow:0 30px 50px -30px rgba(23,48,42,.5);transform:rotate(-2deg)}
.ob .pic .arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
.ob .pic .stk{position:absolute;left:24px;bottom:16%;display:block;padding:14px 16px;border-radius:14px;background:#FFFDF9;font:500 18px/1.2 var(--serif);color:var(--ink);box-shadow:0 18px 30px -18px rgba(23,48,42,.45);transform:rotate(-4deg);max-width:62%;backdrop-filter:none}
.ob .pic .pil{position:absolute;right:30px;top:18%;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--accent);color:#fff;font:700 13px Outfit,var(--font);transform:rotate(5deg);box-shadow:0 10px 20px -10px rgba(109,74,255,.8)}
.ob .pic .pil svg{width:15px;height:15px}
.ob .skip{background:rgba(255,253,249,.8)}
.ob .dots i{background:rgba(23,48,42,.18)}
.ob .dots i.on{background:var(--deep)}
.ob .btn.p{background:var(--deep)}
.hero2{display:grid;grid-template-columns:1fr 128px;align-items:center;gap:8px;width:calc(100% - 40px);margin:14px 20px 4px;padding:20px 16px 20px 20px;border-radius:24px;background:var(--lilac);text-align:left;overflow:hidden;transition:transform .15s}
.hero2:active{transform:scale(.98)}
.hero2 .pl{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--soft);font-size:11.5px;font-weight:700;color:var(--green-2)}
.hero2 h3{margin:12px 0 6px;font:600 25px/1.1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.hero2 p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.h2p{position:relative;height:150px}
.h2p .arch{position:absolute;inset:0 4px 0 8px;border-radius:999px 999px 18px 18px;overflow:hidden;transform:rotate(3deg);box-shadow:0 18px 30px -18px rgba(23,48,42,.5)}
.h2p .nt{position:absolute;left:-14px;bottom:8px;padding:7px 10px;border-radius:10px;background:var(--soft);font:500 13px var(--serif);transform:rotate(-5deg);box-shadow:0 10px 18px -10px rgba(23,48,42,.4);white-space:nowrap}
.trade{background:var(--sage);box-shadow:none}
.tr-div{background:rgba(23,48,42,.1)}
.tr-div i{box-shadow:0 0 0 4px var(--sage)}
.tr .th{background:var(--soft)}
.stp{background:var(--soft)}
.done .ring{box-shadow:0 0 0 14px var(--lilac)}
.rqc{background:var(--soft)}
.pair .th{box-shadow:0 0 0 3px var(--soft)}
.pair i{box-shadow:0 0 0 3px var(--soft)}
.note.g,.want{background:var(--lilac)}
.stats div:nth-child(1){background:var(--lilac);box-shadow:none}.stats div:nth-child(2){background:var(--sage);box-shadow:none}.stats div:nth-child(3){background:var(--sand);box-shadow:none}
.facts{background:var(--soft)}
.li b{font-weight:600}
/* marketplace realism */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
.locb{display:flex;align-items:center;gap:10px;text-align:left}
.locb>svg:first-child{width:22px;height:22px;color:var(--accent)}
.locb small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.locb b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.locb>svg:last-child{width:16px;height:16px;transform:rotate(90deg);color:var(--muted)}
.ib .dotn{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.ib{position:relative}
.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none}

.cat.on{color:var(--ink)}
.cat.on .ci{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--deep)}
.h2 .cnt{font-size:13px;color:var(--muted);font-weight:600}
.li .pr,.hsc .pr{margin:10px 2px 2px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.li .pr span,.hsc .pr span,.prc span{font-weight:600;color:var(--muted);font-size:.8em}
.li b{margin-top:0;font-weight:500;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .cnt2{position:absolute;right:16px;bottom:16px;padding:6px 10px;border-radius:999px;background:rgba(16,20,19,.55);color:#fff;font-size:12px;font-weight:600}
.prc{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.ttl h2{font-size:22px;margin-bottom:8px}
.pmeta{display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;color:var(--muted)}
.pmeta svg{width:15px;height:15px}
.dl{margin:20px 20px 0;border-radius:20px;background:var(--soft);box-shadow:0 0 0 1px var(--hair);padding:4px 16px}

.dl span{color:var(--muted)}
.stars{color:#F2A900;letter-spacing:1px;font-size:12.5px}

.hs{display:flex;gap:12px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hsc{flex:none;width:140px;text-align:left}
.hsc .ph{display:block;width:140px;height:140px;border-radius:18px;overflow:hidden}
.hsc b{display:block;font-size:13.5px;font-weight:500;margin:0 2px;line-height:1.3}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:16px 20px 0}
.badges span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;font-weight:600}

.prof>div>span{display:block;margin-top:2px}.prof .stars{color:#F2A900;display:inline;margin:0}
.qr{display:flex;flex-direction:column;gap:8px;margin:16px 20px 0}.qr button{text-align:left;padding:13px 16px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--hair);font-size:15px;background:var(--soft)}.qr button.on{box-shadow:inset 0 0 0 2px var(--deep);font-weight:600}

.sdn{position:absolute;inset:0;overflow:hidden;padding:96px 20px 190px;text-align:center;background:linear-gradient(180deg,var(--lilac) 0,var(--lilac) 200px,var(--bg) 420px)}
.conf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;opacity:0;animation:cf 1.8s var(--d) ease-out forwards}
@keyframes cf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(340px) rotate(var(--r))}}
.sd-pair{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:14px;margin-top:4px}
.sd-c{width:136px;padding:8px 8px 12px;border-radius:22px;background:#fff;box-shadow:0 18px 36px -20px rgba(23,48,42,.45);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}

.sd-c .ph{display:block;height:120px;border-radius:16px;overflow:hidden}
.sd-c small{display:block;margin-top:10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sd-c b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-size:13.5px;line-height:1.3}
.sd-b{position:absolute;left:50%;top:58px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg);z-index:2;animation:pop .5s .3s cubic-bezier(.2,1.6,.4,1) both}
.sd-b svg{width:22px;height:22px}
.sdn h2{margin:30px 0 6px;font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.025em}
.sdn p{margin:0;font-size:15.5px;color:var(--muted)}
.sd-st{display:flex;justify-content:center;gap:10px;margin-top:18px}
.sd-st span{padding:9px 14px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--hair);font-size:14px;color:var(--muted)}
.sd-st b{color:var(--ink);font-weight:800;margin-right:2px}
.rate{display:flex;align-items:center;gap:14px;margin:26px 0 0;padding:16px;border-radius:20px;background:var(--soft);box-shadow:0 0 0 1px var(--hair);text-align:left}

.opt .ico svg{width:21px;height:21px}

function card(x){var p=person(x.by);return '<div class="li"><button data-a="open" data-v="'+x.id+'" style="display:block;width:100%;text-align:left"><div class="ph">'+art(x.art)+''+'</div><p class="pr">'+priceLine(x)+'</p><b>'+x.t+'</b><small>'+x.km+' km · '+x.ago+'</small></button><button class="hv '+(S.saved[x.id]?'on':'')+'" data-a="save" data-v="'+x.id+'" aria-label="Save">'+ic('heart')+'</button></div>'}
function gridHTML(){var f=filtered();if(!f.length)return '<div class="empty" style="grid-column:1/-1"><b>'+(S.cat!=='All'?'No '+S.cat.toLowerCase()+' supplies nearby yet':'Nothing here yet')+'</b>'+(S.match?'Turn off Wants what I have, or try a wider distance.':'Try another category or a wider distance.')+'</div>';return f.map(card).join('')}
var CATPH={'All':'flatlay','Yarn & fibre':'yarn2','Paint & draw':'water','Paper craft':'paper','Sewing':'hoop','Jewellery':'beads','Music':'uke'};
V.home=function(){
  return '<div class="hdr"><button class="locb" data-a="loc">'+ic('pin')+'<span><small>Swapping near</small><b>'+S.me.hood+' · '+S.km+' km</b></span>'+ic('chev')+'</button><button class="ib w" data-a="notifs" aria-label="Notifications">'+ic('bell')+'<i class="dotn"></i></button></div>'
  +'<label class="search">'+ic('search')+'<input id="q" placeholder="Search yarn, paint, beads…" value="'+esc(S.q)+'" aria-label="Search"><button class="fb" data-a="filter" aria-label="Filters">'+ic('sliders')+(S.mode!=='All'||S.match||(S.cond&&S.cond!=='Any')?'<i></i>':'')+'</button></label>'
  +'<div class="chips hc">'+(HOME_TAGS.indexOf(S.cat)<0?['All',S.cat].concat(HOME_TAGS.slice(1)):HOME_TAGS).map(function(c){return '<button class="chip '+(S.cat===c?'on':'')+'" data-a="cat" data-v="'+c+'">'+c+'</button>'}).join('')+'<button class="chip more" data-a="allcats">All categories'+ic('chev')+'</button></div>'
  +((S.match||(S.cond&&S.cond!=='Any')||S.mode!=='All')?'<div class="af">'+(S.mode!=='All'?'<button data-a="unmode">'+(S.mode==='Swap'?'Swap only':'For sale only')+ic('x')+'</button>':'')+(S.match?'<button data-a="unmatch">'+ic('swap')+'Wants what I have'+ic('x')+'</button>':'')+(S.cond&&S.cond!=='Any'?'<button data-a="uncond">'+S.cond+ic('x')+'</button>':'')+'</div>':'')
  
  
  +'<div class="h2"><b>'+(S.mode==='Swap'?'Open to swap nearby':S.mode==='Buy'?'For sale nearby':'Near you')+'</b><span class="cnt">'+filtered().length+(filtered().length===1?' item':' items')+'</span></div>'
  +'<div class="grid" id="grid">'+gridHTML()+'</div>'};
V.listing=function(p){var x=item(p.id),o=person(x.by),fn=o.n.split(' ')[0];
  var more=L.filter(function(y){return y.by===x.by&&y.id!==x.id});
  return '<div class="nav lh"><button class="ib" data-a="back" aria-label="Back">'+ic('back')+'</button><span></span><span class="acts2"><button class="ib" data-a="share" aria-label="Share">'+ic('share')+'</button><button class="ib" data-a="save" data-v="'+x.id+'" aria-label="Save">'+ic('heart').replace('fill="none"',S.saved[x.id]?'fill="currentColor"':'fill="none"')+'</button></span></div><div class="hero full">'+art(x.art)+'<span class="live">'+ic('camera')+'Photo taken live</span><span class="cnt2">1 / 1</span></div>'
  +'<div class="ttl"><h2>'+x.t+'</h2><p class="prc">'+priceLine(x)+'</p><p class="pmeta">'+ic('pin')+x.km+' km · '+o.hood+' · Posted '+x.ago.toLowerCase()+'</p></div>'
  +'<div class="dl"><div><span>Condition</span><b>'+x.cond+'</b></div><div><span>Category</span><b>'+x.cat+'</b></div><div><span>Hand-off</span><b>Meet or ship</b></div></div>'
  +'<div class="sec"><h3>Description</h3>'+x.d+'</div>'
  +(x.sw?'<div class="sec"><h3>Open to swap for</h3><div class="want">'+ic('swap')+x.want+'</div></div>':'')
  +'<div class="sec"><h3>Owner</h3></div><div class="who" style="margin-top:0">'+av(o)+'<div class="n"><b>'+o.n+VB+'</b>'+revBtn(x.by,o.r,o.rv,o.sw)+'</div></div>'
  +'<div class="safe">'+ic('shield')+'<span><b>Swap safely.</b> Meet in a public place and check the item before you confirm.</span></div>'
  +(more.length?'<div class="h2"><b>More from '+fn+'</b></div><div class="hs">'+more.map(function(y){return '<button class="hsc" data-a="open" data-v="'+y.id+'"><span class="ph">'+art(y.art)+'</span><p class="pr">'+priceLine(y)+'</p><b>'+y.t+'</b></button>'}).join('')+'</div>':'')
  +'<div class="dock"><div class="row" style="grid-template-columns:52px '+(x.sw&&x.price!=null?'1fr 1.5fr':'1fr')+'"><button class="btn s" data-a="msg" data-v="'+x.id+'" aria-label="Message '+fn+'" style="padding:0">'+ic('chat')+'</button>'+(x.price!=null?'<button class="btn '+(x.sw?'s':'p')+'" data-a="req" data-v="'+x.id+'" data-k="buy">Buy $'+x.price+'</button>':'')+(x.sw?'<button class="btn cta" data-a="req" data-v="'+x.id+'" data-k="swap">Offer a swap</button>':'')+'</div></div>'};

/* request flow: 1 offer + hand-off, 2 review, 3 sent */
var SPOTS=[{k:'lib',n:'Spadina Road Library',d:'Inside the front entrance',km:0.4},{k:'stn',n:'Bathurst Station',d:'By the main fare gates',km:0.9},{k:'rob',n:'Robarts Library',d:'Main floor lobby',km:1.2}];
var WHENS=['Weeknight','Saturday','Sunday'];
function updPick(){var e=document.querySelector('.pickd span');if(e)e.textContent=S.req.date?fmtDate(S.req.date)+(S.req.time?' · '+fmtTime(S.req.time):''):'Pick a date and time'}
function fmtDate(d){if(!d)return 'Date to confirm';var t=new Date(d+'T12:00');return t.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(t){if(!t)return '';var h=+t.split(':')[0],m=t.split(':')[1];return (h%12||12)+(m!=='00'?':'+m:'')+(h<12?' am':' pm')}
function spotPlace(r){var k=r.spot||'lib';return k==='own'?(r.ownSpot||'Your own spot'):SPOTS.filter(function(z){return z.k===k})[0].n}
function nextDay(dow){var d=new Date();d.setHours(12,0,0,0);var n=(dow-d.getDay()+7)%7||7;d.setDate(d.getDate()+n);return d}
function dlabel(d,o){return d.toLocaleDateString('en-CA',o||{weekday:'short',month:'short',day:'numeric'})}
function weekRange(){var a=nextDay(1),b=new Date(a);b.setDate(a.getDate()+4);return dlabel(a,{month:'short',day:'numeric'})+'–'+b.getDate()}
function spotWhen(r){var w=r.when||'Saturday';if(w==='Weeknight')return 'Weeknights, '+weekRange();if(w==='Saturday')return dlabel(nextDay(6));if(w==='Sunday')return dlabel(nextDay(0));if(w==='custom')w=fmtDate(r.date)+(r.time?', '+fmtTime(r.time):'');return w}
function spotName(r){return spotPlace(r)+', '+spotWhen(r)}
function flowHead(t,n,act){return '<div class="fh"><button class="ib" data-a="'+(act||'back')+'" aria-label="Back">'+ic('back')+'</button><b>'+t+'</b><span class="fn">'+n+' of 2</span><div class="prog"><i class="on"></i><i class="'+(n>1?'on':'')+'"></i></div></div>'}
V.request=function(p){var x=item(p.id),r=S.req;
  var offer=r.kind==='swap'?'<div class="sec" style="margin-top:6px"><h3>Your item to swap</h3></div><div class="pad">'+S.mine.map(function(m){return '<button class="opt '+(r.mine===m.id?'on':'')+'" data-a="pick" data-v="'+m.id+'"><span class="th">'+art(m.art)+'</span><span class="tx"><b>'+m.t+'</b><span>'+m.cond+' condition</span></span><span class="ra"></span></button>'}).join('')+'</div>'
    :'<div class="note g">'+ic('info')+'<span>You pay $'+x.price+' only after '+person(x.by).n.split(' ')[0]+' accepts.</span></div>';
  return flowHead(r.kind==='swap'?'Make an offer':'Buy now',1)
  +'<div class="rw" style="margin:4px 20px 0;padding:0;background:none"><span class="th">'+art(x.art)+'</span><span class="tx"><b>'+x.t+'</b><span class="one">'+person(x.by).n+' · '+x.km+' km · '+priceLine(x).replace(/<[^>]+>/g,'')+'</span></span></div>'
  +offer
  +'<div class="sec"><h3>How will you hand it off?</h3></div><div class="pad">'
  +'<button class="opt '+(r.how==='meet'?'on':'')+'" data-a="how" data-v="meet"><span class="ico" style="width:40px;height:40px;border-radius:12px;background:var(--fill);color:var(--ink);display:grid;place-items:center">'+ic('meet')+'</span><span class="tx"><b>Meet at a safe spot</b><span>A public spot near you</span></span><span class="ra"></span></button>'
  +(r.how==='meet'?'<div class="mp"><p class="mpl">Where</p>'+SPOTS.map(function(z){return '<button class="spot '+((r.spot||'lib')===z.k?'on':'')+'" data-a="spot" data-v="'+z.k+'"><span class="tx"><b>'+z.n+'</b></span><span class="km">'+z.km+' km</span><span class="ra"></span></button>'}).join('')
  +'<button class="spot '+(r.spot==='own'?'on':'')+'" data-a="spot" data-v="own"><span class="tx"><b class="oth">'+ic('plus')+'Somewhere else</b></span><span class="ra"></span></button>'
  +(r.spot==='own'?'<input class="cin" id="ownspot" placeholder="e.g. Christie Pits, by the park entrance" value="'+esc(r.ownSpot||'')+'" oninput="S.req.ownSpot=this.value">':'')
  +'<p class="mpl">When</p><div class="whn">'+WHENS.map(function(w){return '<button class="'+((r.when||'Saturday')===w?'on':'')+'" data-a="when" data-v="'+w+'">'+({Weeknight:'Weekdays',Saturday:'Sat '+nextDay(6).getDate(),Sunday:'Sun '+nextDay(0).getDate()})[w]+'</button>'}).join('')+'<button class="'+(r.when==='custom'?'on':'')+'" data-a="when" data-v="custom" aria-label="Pick a date">'+ic('cal')+'</button></div>'
  +(r.when==='custom'?'<div class="dt"><label>Date<input type="date" id="cdate" min="2026-11-02" value="'+(r.date||'')+'" onchange="S.req.date=this.value;updPick()"></label><label>Time<input type="time" id="ctime" step="900" value="'+(r.time||'')+'" onchange="S.req.time=this.value;updPick()"></label></div>':'')+'</div>':'')
  +'<button class="opt '+(r.how==='ship'?'on':'')+'" data-a="how" data-v="ship"><span class="ico" style="width:40px;height:40px;border-radius:12px;background:var(--fill);color:var(--ink);display:grid;place-items:center">'+ic('truck')+'</span><span class="tx"><b>Ship it</b><span>Tracked, no meetup</span></span><span class="ra"></span></button></div>'
  +'<div class="fld"><label for="nt">Note</label><textarea id="nt" rows="2" placeholder="Say hi (optional)" oninput="S.req.note=this.value">'+esc(r.note||'')+'</textarea></div>'
  +'<div class="dock"><button class="btn p" data-a="review" '+(r.kind==='swap'&&!r.mine?'disabled':'')+'>Review offer</button></div>'};
V.review=function(){var r=S.req,x=item(r.id),m=r.mine&&item(r.mine);
  return flowHead('Review your offer',2)
  +(r.kind==='swap'?'<div class="trade"><div class="tr"><span class="th">'+art(x.art)+'</span><div><small class="get">You get</small><b>'+x.t+'</b><span class="s">'+x.cond+' condition · from '+person(x.by).n.split(' ')[0]+'</span></div></div><div class="tr-div"><i>'+ic('vswap')+'</i></div><div class="tr"><span class="th">'+art(m.art)+'</span><div><small>You give</small><b>'+m.t+'</b><span class="s">Yours · '+m.cond+' condition</span></div></div></div>':'')
  +'<div class="rev"><div><span>With</span><b>'+person(x.by).n+'</b></div><div><span>Type</span><b>'+(r.kind==='swap'?'Swap, no money':'Buy for $'+x.price)+'</b></div><div><span>Hand-off</span><b>'+(r.how==='meet'?'Meet at a safe spot':'Shipping')+'</b></div>'+(r.how==='meet'?'<div><span>Where</span><b>'+spotPlace(r)+'</b></div><div><span>When</span><b>'+spotWhen(r)+'</b></div>':'')+(r.note?'<div><span>Note</span><b style="font-weight:500">'+esc(r.note)+'</b></div>':'')+'</div>'
  +'<div class="note">'+ic('info')+'<span>Nothing is final until '+person(x.by).n.split(' ')[0]+' accepts.</span></div>'
  +'<div class="dock"><button class="btn p" data-a="send">Send offer</button><button class="btn t" data-a="back">Edit</button></div>'};
V.sent=function(){var r=S.req,x=item(r.id),m=r.mine&&item(r.mine),fn=person(x.by).n.split(' ')[0];
  return '<div class="snt"><div class="ring">'+ic('check')+'</div><h2>Offer sent</h2><p>'+fn+' usually replies within a day. We will let you know.</p>'
  +'<div class="sm">'+(m?'<div class="sm-p"><span>'+art(m.art)+'</span><i>'+ic('swap')+'</i><span>'+art(x.art)+'</span></div>':'<div class="sm-p"><span>'+art(x.art)+'</span></div>')
  +'<div class="sm-t"><b>'+(m?m.t+' for '+x.t:x.t)+'</b><span>'+(r.how==='meet'?spotPlace(r)+' · '+spotWhen(r):'Shipping')+'</span></div></div>'
  +stepsHTML(1)+'</div>'
  +'<div class="dock"><button class="btn p" data-a="tosw">See my swaps</button><button class="btn t" data-a="tohome">Keep browsing</button></div>'};
function stepsHTML(at){var st=[['send','Sent'],['check','Accepted'],['meet','Hand-off'],['swap','Swapped']];
  return '<div class="stp">'+st.map(function(x,i){return '<div class="'+(i<at?'sd':i===at?'sn':'')+'"><i>'+(i<at?ic('check'):i===at?ic('clock'):ic(x[0]))+'</i><span>'+x[1]+'</span></div>'}).join('')+'</div>'}

/* swaps tab */
V.swaps=function(p){var t=p.t||'in';
  var list=S.reqs.filter(function(r){return t==='done'?r.status==='done':(r.dir===t&&r.status!=='done'&&r.status!=='cancelled')});
  var rows=list.map(function(r){var x=item(r.theirs),m=r.mine&&item(r.mine),o=person(r.from),fn=o.n.split(' ')[0],buy=r.kind==='buy',inn=r.dir==='in';
    var lab={new:'',pending:'<span class="tag wait">Waiting</span>',accepted:'<span class="tag ok">Accepted</span>',done:'<span class="tag wait">Swapped</span>'}[r.status];
    var sub=buy?'You pay $'+x.price:'For your '+(m?m.t.toLowerCase():'item');
    return '<button class="rqc" data-a="openreq" data-v="'+r.id+'"><div class="top2">'+av(o)+'<b>'+(inn?o.n+' wants to swap':'You asked '+fn)+'</b>'+lab+'</div>'
      +'<div class="mid2"><span class="pair"><span class="th">'+art(x.art)+'</span><span class="th">'+(buy?'$'+x.price:art(m.art))+'</span><i>'+ic('swap')+'</i></span><div><b>'+x.t+'</b><span class="s">'+sub+'</span></div></div></button>'}).join('');
  return '<div class="top"><h1>Swaps</h1></div><div class="pad" style="margin:4px 0 18px"><div class="seg">'+[['in','Received'],['out','Sent'],['done','Done']].map(function(s){return '<button class="'+(t===s[0]?'on':'')+'" data-a="subtab" data-v="'+s[0]+'">'+s[1]+'</button>'}).join('')+'</div></div>'
  +(rows?rows:'<div class="empty"><b>'+(t==='in'?'No requests yet':t==='out'?'You have not asked for anything yet':'No finished swaps yet')+'</b>'+(t==='done'?'Finished swaps show up here.':'Find something you like and request a swap.')+'</div>')};

V.req=function(p){var r=S.reqs.filter(function(q){return q.id===p.id})[0],x=item(r.theirs),m=r.mine&&item(r.mine),o=person(r.from),fn=o.n.split(' ')[0],buy=r.kind==='buy',inn=r.dir==='in';
  var title=r.status==='done'?'Swapped with '+fn:r.status==='accepted'?'Swap accepted':inn?fn+' wants to swap':'Waiting for '+fn;
  var head='<div class="nav"><button class="ib" data-a="back" aria-label="Back">'+ic('back')+'</button><div class="t">'+(buy?'Buy request':'Swap request')+'</div><button class="ib" data-a="chat" data-v="'+r.id+'" aria-label="Message '+fn+'">'+ic('chat')+'</button></div>';
  var hd='<div class="rq-hd">'+av(o)+'<div><h2>'+title+VB+'</h2><div class="meta">'+revBtn(r.from,o.r,o.rv,o.sw)+'</div></div></div>';
  var trade='<div class="trade"><div class="tr"><span class="th">'+art(x.art)+'</span><div><small class="get">You get</small><b>'+x.t+'</b><span class="s">'+x.cond+' condition · from '+fn+'</span></div></div>'
    +'<div class="tr-div"><i>'+ic('vswap')+'</i></div>'
    +'<div class="tr"><span class="th">'+(buy?'$'+x.price:art(m.art))+'</span><div><small>'+(buy?'You pay':'You give')+'</small><b>'+(buy?'$'+x.price+' in the app':m.t)+'</b><span class="s">'+(buy?'Only after '+fn+' accepts':'Yours · '+m.cond+' condition')+'</span></div></div></div>';
  var nt=r.note?'<div class="sec"><h3>'+(inn?fn+'’s note':'Your note')+'</h3><div class="bub" style="max-width:100%">'+esc(r.note)+'</div></div>':'';
  var det='<div class="rev"><div><span>Hand-off</span><b>'+(r.how==='meet'?'Meet at a safe spot':'Shipping')+'</b></div>'+(r.how==='meet'?'<div><span>Where</span><b>'+spotPlace(r)+'</b></div><div><span>When</span><b>'+spotWhen(r)+'</b></div>':'')+''+(buy?'<div><span>Price</span><b>$'+x.price+'</b></div>':'')+'</div>';
  var body='',dock='';
  if(inn&&r.status==='new'){
    dock='<div class="dock"><button class="btn ok" data-a="accept" data-v="'+r.id+'">Accept swap</button><div class="row" style="margin-top:10px"><button class="btn s" data-a="counter" data-v="'+r.id+'">Renegotiate</button><button class="btn dcl" data-a="decline" data-v="'+r.id+'">Decline</button></div></div>';
  }else if(r.status==='accepted'){
    body='<div class="sec"><h3>Next steps</h3></div><div style="margin:6px 20px 0">'+stepsHTML(2)+'</div>';
    dock='<div class="dock"><button class="btn p" data-a="swapped" data-v="'+r.id+'">We swapped!</button><button class="btn t" data-a="cancelreq" data-v="'+r.id+'">Cancel this swap</button></div>';
  }else if(r.status==='pending'){
    body='<div class="sec"><h3>What happens next</h3></div><div style="margin:6px 20px 0">'+stepsHTML(1)+'</div>';
    dock='<div class="dock"><button class="btn s" data-a="sim" data-v="'+r.id+'">Preview: they accept</button><button class="btn lnk" data-a="cancelreq" data-v="'+r.id+'">Cancel request</button></div>';
  }else{body='<div style="margin:24px 20px 0">'+stepsHTML(4)+'</div>'}
  return head+hd+trade+nt+det+body+dock};
V.chat=function(p){var r=S.reqs.filter(function(q){return q.id===p.id})[0],o=person(r.from),x=item(r.theirs),m=r.mine&&item(r.mine);
  S.msgs=S.msgs||{};if(!S.msgs[r.id])S.msgs[r.id]=[[0,r.note||'Hi! Is this still available?','2:14 pm'],[1,'Hi Maya! Yes, happy to swap. Does Saturday work?','2:20 pm'],[0,'Saturday works. See you at the library at 2 pm.','2:22 pm']];
  return '<div class="nav"><button class="ib" data-a="back" aria-label="Back">'+ic('back')+'</button><div class="t ch">'+av(o)+'<span>'+o.n+revBtn(r.from,o.r,o.rv)+'</span></div><span></span></div>'
  +'<button class="chi2" data-a="openreq" data-v="'+r.id+'"><span class="sm-p"><span>'+art(x.art)+'</span>'+(m?'<i>'+ic('swap')+'</i><span>'+art(m.art)+'</span>':'')+'</span><span class="tx"><b>'+x.t+'</b><span>'+(m?'Swap for your '+m.t.split(',')[0].toLowerCase():priceLine(x).replace(/<[^>]+>/g,''))+(r.how==='meet'?' · '+spotWhen(r):'')+'</span></span><span class="chev">'+ic('chev')+'</span></button>'
  +'<div class="chat"><div class="day">Today</div>'+S.msgs[r.id].map(function(q){return '<div class="bub'+(q[0]?' me':'')+'">'+esc(q[1])+'<small>'+q[2]+'</small></div>'}).join('')+'</div>'
  +'<div class="dock cmp"><input id="cmsg" placeholder="Message '+o.n.split(' ')[0]+'…" aria-label="Message"><button class="snd" data-a="csend" data-v="'+r.id+'" aria-label="Send">'+ic('send')+'</button></div>'};

/* post flow */
function draftOk(){var d=S.draft;return d.photo&&d.t&&d.t.trim()&&d.cat&&(d.sw||d.sell)&&(!d.sell||d.price)}
V.post=function(){var d=S.draft;
  return flowHead('New listing',1,'cancelpost')
  +'<div class="photo"><button class="th '+(d.photo?'':'add')+'" data-a="camera" aria-label="Take a photo">'+(d.photo?art(d.photo):ic('camera'))+'</button><div><b style="font-size:15px;display:block">'+(d.photo?'Photo added':'Take a live photo')+'</b><span style="font-size:13px;color:var(--muted);line-height:1.45;display:block;margin-top:3px">'+(d.photo?'Tap to retake':'Shows the real condition')+'</span></div></div>'
  +'<div class="fld"><label for="pt">Item</label><input id="pt" data-in="t" placeholder="e.g. Oil pastel kit" value="'+esc(d.t||'')+'"></div>'

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function runDemo(name){
  document.body.classList.add('demo');
  var dev=document.getElementById('dev'),cur=document.createElement('div'),fade=document.createElement('div');cur.className='cur';fade.className='dfade';dev.appendChild(fade);dev.appendChild(cur);
  var D=DEMOS[name];
  while(true){
    var keep=JSON.parse(INIT);Object.keys(keep).forEach(function(k){S[k]=keep[k]});S.guest=false;close();
    var cam=dev.querySelector('.cam');if(cam)cam.remove();
    D.start();cur._x=dev.clientWidth*.62;cur._y=dev.clientHeight*.78;cur.style.transform='translate('+cur._x+'px,'+cur._y+'px)';
    await sleep(60);fade.classList.remove('on');await sleep(500);cur.style.opacity=1;await sleep(500);
    for(var i=0;i<D.steps.length;i++){var st=D.steps[i];
      var el=document.querySelector(st.s||st.type);if(!el){await sleep(400);el=document.querySelector(st.s||st.type)}if(!el)break;
      if(el.scrollIntoView){var sc=el.closest('.screen');if(sc){var r0=el.getBoundingClientRect(),rs=sc.getBoundingClientRect();if(r0.bottom>rs.bottom-120||r0.top<rs.top+60){sc.scrollTo({top:sc.scrollTop+r0.top-rs.top-rs.height*.4,behavior:'smooth'});await sleep(500)}}}
      await sleep(80);var r=el.getBoundingClientRect(),d=dev.getBoundingClientRect(),ks=d.width/dev.offsetWidth||1;
      var tx=(r.left-d.left+r.width/2)/ks,ty=(r.top-d.top+r.height/2)/ks;
      if(st.type){tx=(r.right-d.left)/ks-24;ty=(r.bottom-d.top)/ks+26}
      var dist=Math.hypot(tx-(cur._x||tx),ty-(cur._y||ty)),dur=Math.max(.55,Math.min(1.15,.45+dist/700));
      cur.style.transitionDuration=dur+'s, .3s';cur.style.transform='translate('+tx+'px,'+ty+'px)';cur._x=tx;cur._y=ty;
      await sleep(dur*1000+120);
      if(st.type){for(var c=1;c<=st.text.length;c++){el.value=st.text.slice(0,c);el.dispatchEvent(new Event('input',{bubbles:true}));await sleep(45)}await sleep(500)}
      else{cur.classList.remove('dn');void cur.offsetWidth;cur.classList.add('dn');await sleep(170);el.click();await sleep(st.after||1000)}
    }
    await sleep(600);cur.style.opacity=0;fade.classList.add('on');await sleep(600);
  }
}
