<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillSwap film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@800&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#FAF7F2}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;color:#2B2A27}
.wrap{position:absolute;left:0;top:0;width:1200px;height:675px;transform-origin:0 0;overflow:hidden;background:#FAF7F2;transition:background-color 0.51s ease}
img{display:block;width:100%;height:100%;object-fit:cover}
.ease{transition:width 0.595s cubic-bezier(.77,0,.18,1),height 0.595s cubic-bezier(.77,0,.18,1),left 0.595s cubic-bezier(.77,0,.18,1),top 0.595s cubic-bezier(.77,0,.18,1),border-radius 0.595s cubic-bezier(.77,0,.18,1),opacity 0.255s ease;will-change:width,height,left,top}
.fade{transition:opacity 0.34s ease,transform 0.425s cubic-bezier(.2,.8,.2,1)}
.hide{opacity:0!important;pointer-events:none}
/* the one card that keeps changing shape */
#card{position:absolute;left:600px;top:337px;width:0;height:0;border-radius:28px;background:#fff;box-shadow:0 0 0 1px rgba(43,42,39,.06),0 30px 60px -36px rgba(43,42,39,.4);transform:translate(-50%,-50%);overflow:hidden;opacity:0}
.v{position:absolute;inset:0;opacity:0;transform:scale(.97);transform-origin:50% 50%;transition:opacity 0.119s ease,transform 0.119s ease}
.v.on{opacity:1;transform:none;transition:opacity 0.255s ease 0.357s,transform 0.383s cubic-bezier(.2,.8,.2,1) 0.357s}

.v.now{transition:none!important}
/* start line */
#post{position:absolute;left:600px;top:337px;transform:translate(-50%,-50%);font:500 34px Inter,sans-serif;color:#8A857D;display:flex;align-items:center;gap:14px;white-space:nowrap}
#post svg{width:30px;height:30px}
/* compose view */
.cmp{padding:34px 38px;display:flex;gap:28px}
.slot{flex:none;width:150px;height:150px;border-radius:20px;border:2px dashed #D9D2C6;display:grid;place-items:center;color:#B5AEA3;overflow:hidden;position:relative;transition:border-color 0.255s}
.slot svg{width:40px;height:40px}
.slot img{position:absolute;inset:0;opacity:0;transform:scale(1.1);transition:opacity 0.34s,transform 0.51s cubic-bezier(.2,.8,.2,1)}
.slot.f{border-color:transparent}.slot.f img{opacity:1;transform:none}
.typ{font:500 30px/1.3 Inter,sans-serif;min-height:80px;padding-top:6px}
.typ .k{color:#C4532F}
.caret{display:inline-block;width:2px;height:32px;background:#2B2A27;vertical-align:-5px;margin-left:2px;animation:bl 0.85s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.tg{display:flex;gap:10px;margin-top:26px}
.tg span{height:44px;padding:0 20px;border-radius:999px;display:grid;place-items:center;font:600 18px Inter,sans-serif;background:#F2ECE3;transition:background 0.212s,color 0.212s}
.tg span.on{background:#17302A;color:#fff}
/* tile views */
.tile{position:absolute;top:337px;width:250px;height:316px;margin-top:-158px;border-radius:26px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(43,42,39,.06),0 30px 60px -36px rgba(43,42,39,.45);opacity:0}
.tile .ph{height:220px}
.tile .tx{padding:16px 20px}
.tile b{display:block;font:600 21px Inter,sans-serif}
.tile small{display:flex;align-items:center;gap:8px;margin-top:6px;font:500 16px Inter,sans-serif;color:#8A857D}
.tile small i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px Inter,sans-serif;font-style:normal}
#orb{position:absolute;left:600px;top:337px;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#C4532F;color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform 0.383s cubic-bezier(.2,1.6,.4,1),background 0.17s;z-index:3;box-shadow:0 0 0 10px rgba(255,255,255,.6)}
#orb svg{width:40px;height:40px;transition:transform 0.765s cubic-bezier(.65,0,.25,1)}
#orb.p{background:#9A3D20}
/* offer view */
.off{padding:32px 36px}
.off .row{display:flex;align-items:center;gap:18px}
.off .pair{display:flex;align-items:center}
.off .pair span{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff}
.off .pair span+i+span{margin-left:-14px}
.off .pair i{width:34px;height:34px;margin-left:-14px;border-radius:50%;background:#C4532F;color:#fff;display:grid;place-items:center;z-index:2;box-shadow:0 0 0 4px #fff}
.off .pair i svg{width:17px;height:17px}
.off b{display:block;font:600 24px Inter,sans-serif}
.off small{display:block;margin-top:4px;font:500 18px Inter,sans-serif;color:#8A857D}
.meet{display:flex;align-items:center;gap:10px;margin-top:22px;padding:14px 16px;border-radius:16px;background:#F7F3EE;font:500 18px Inter,sans-serif}
.meet svg{width:22px;height:22px;color:#C4532F}
.send{margin-top:20px;height:58px;border-radius:999px;background:#17302A;color:#fff;display:grid;place-items:center;font:600 20px Inter,sans-serif;transition:background 0.255s,color 0.255s,transform 0.128s}
.send.d{background:#FBE4D8;color:#9A3D20}
.send.pr{transform:scale(.96)}
/* notification view */
.nt{display:flex;align-items:center;gap:16px;padding:0 26px;height:100%}
.nt .av{width:52px;height:52px;border-radius:50%;background:#C98B6B;color:#fff;display:grid;place-items:center;font:700 22px Inter,sans-serif;flex:none}
.nt b{font:600 22px Inter,sans-serif}.nt small{display:block;font:500 16px Inter,sans-serif;color:#8A857D;margin-top:3px}
/* end mark */
#mark{position:absolute;left:600px;top:337px;transform:translate(-50%,-50%) scale(.9);display:flex;align-items:center;gap:16px;opacity:0;transition:opacity 0.425s,transform 0.595s cubic-bezier(.2,.8,.2,1)}
#mark.on{opacity:1;transform:translate(-50%,-50%)}
#mark svg{width:72px;height:72px}
#mark span{font:800 70px Outfit,Inter,sans-serif;letter-spacing:-.045em;color:#17302A}
/* cursor */
#cur{position:absolute;left:0;top:0;width:28px;height:28px;margin:-3px 0 0 -5px;z-index:9;opacity:0;transition:transform 0.51s cubic-bezier(.45,0,.2,1),opacity 0.212s}
#cur svg{width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));transition:transform .14s ease}
#cur.p svg{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#in{position:absolute;inset:0;transform:scale(1.22);transform-origin:600px 337px}
</style>
</head>
<body>
<div class="wrap" id="w"><div id="in">
  <div id="post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Post something you no longer use</div>

  <div id="card" class="ease">
    <div class="v cmp" id="vC">
      <div class="slot" id="slot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><img src="media/photos/yarn.jpg" alt=""></div>
      <div style="flex:1"><div class="typ" id="typ"></div><div class="tg"><span id="tgS">Swap</span><span>Sell</span></div></div>
    </div>
    <div class="v off" id="vO">
      <div class="row"><div class="pair"><span><img src="media/photos/yarn.jpg" alt=""></span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg></i><span><img src="media/photos/water.jpg" alt=""></span></div>
        <div><b>Yarn for paints</b><small>with Maya · 0.8 km away</small></div></div>
      <div class="meet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Spadina Road Library · Saturday</div>
      <div class="send" id="send">Send offer</div>
    </div>
    <div class="v" id="vT"><div class="ph" style="height:220px"><img id="vTi" src="media/photos/yarn.jpg" alt=""></div><div class="tx" style="padding:16px 20px"><b id="vTb" style="display:block;font:600 21px Inter,sans-serif">Leftover yarn</b><small style="display:flex;align-items:center;gap:8px;margin-top:6px;font:500 16px Inter,sans-serif;color:#8A857D"><i id="vTa" style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px Inter,sans-serif;font-style:normal;background:#fff url(media/sam.jpg) center/cover;box-shadow:0 0 0 1px #E8E1D6"></i>Swap</small></div></div>
    <div class="v nt" id="vN"><span class="av">M</span><span><b>Maya accepted your swap</b><small>See you Saturday</small></span></div>
  </div>

  <div class="tile" id="t1" style="left:315px"><div class="ph"><img src="media/photos/yarn.jpg" alt=""></div><div class="tx"><b>Leftover yarn</b><small><i style="background:#fff url(media/sam.jpg) center/cover;box-shadow:0 0 0 1px #E8E1D6"></i>Swap</small></div></div>
  <div class="tile" id="t2" style="left:635px"><div class="ph"><img src="media/photos/water.jpg" alt=""></div><div class="tx"><b>Watercolour set</b><small><i style="background:#C98B6B">M</i>Swap</small></div></div>
  <div id="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg></div>
  
  <div id="mark"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="#C4532F"/><g transform="translate(8 8)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></g></svg><span>skillswap</span></div>
  <div id="cur"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#17302A" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
</div></div>
<script>
var w=document.getElementById('w'),inn=document.getElementById('in');
function fit(){var k=Math.min(innerWidth/1200,innerHeight/675);w.style.transform='translate('+(innerWidth-1200*k)/2+'px,'+(innerHeight-675*k)/2+'px) scale('+k+')'}
fit();addEventListener('resize',fit);
function $(i){return document.getElementById(i)}
var SPEED=0.85;function sleep(ms){return new Promise(function(r){setTimeout(r,ms*SPEED)})}
var visible=true;if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting}).observe(document.body);
function chap(n){try{parent.postMessage({ssChapter:n},'*')}catch(e){}}
var card=$('card'),cur=$('cur'),t1=$('t1'),t2=$('t2'),orb=$('orb');
function bg(c){w.style.backgroundColor=c}
function shape(wd,ht,r,x,y){card.style.width=wd+'px';card.style.height=ht+'px';card.style.borderRadius=(r||28)+'px';card.style.left=(x||600)+'px';card.style.top=(y||337)+'px'}
async function morph(id,wd,ht,r,x,y){card.classList.add('m');view(id);shape(wd,ht,r,x,y);await sleep(430);card.classList.remove('m')}
function show(on){card.style.opacity=on?1:0}
function view(id,now){['vC','vO','vN','vT'].forEach(function(k){var v=$(k);v.classList.toggle('now',!!now);v.classList.toggle('on',k===id)})}
function snap(f){var els=[card,t1,t2];els.forEach(function(e){e.style.transition='none'});f();void card.offsetWidth;els.forEach(function(e){e.style.transition=''})}
/* point the cursor tip at the real centre of an element, in stage units */
function at(el,fx,fy){var r=el.getBoundingClientRect(),b=inn.getBoundingClientRect(),k=b.width/1200;return [(r.left+r.width*(fx==null?.5:fx)-b.left)/k,(r.top+r.height*(fy==null?.5:fy)-b.top)/k]}
function away(){var r=card.getBoundingClientRect(),b=inn.getBoundingClientRect(),k=b.width/1200;return [ (r.right-b.left)/k+70, (r.bottom-b.top)/k+40 ]}
function mv(p){cur.style.opacity=1;cur.style.transform='translate('+p[0]+'px,'+p[1]+'px)'}
async function go(el,fx,fy){await sleep(60);mv(at(el,fx,fy));await sleep(720)}
async function click(){cur.classList.add('p');await sleep(150);cur.classList.remove('p');await sleep(60)}
async function type(t){var el=$('typ');for(var i=1;i<=t.length;i++){el.innerHTML=t.slice(0,i).replace('yarn','<span class="k">yarn</span>')+'<span class="caret"></span>';await sleep(42)}}
function tileTo(el,x,rot){el.style.left=x+'px';el.style.transform='rotate('+(rot||0)+'deg)'}
var TT='left .64s cubic-bezier(.65,0,.35,1),transform .64s cubic-bezier(.65,0,.35,1),opacity .26s';
function setTile(src,name,init,col){$('vTi').src=src;$('vTb').textContent=name;$('vTa').textContent=init;$('vTa').style.background=col}
function reset(){
  bg('#FAF7F2');$('post').classList.remove('hide');$('mark').classList.remove('on');
  snap(function(){shape(0,0);show(0);view('',true);
    [t1,t2].forEach(function(t){t.style.opacity=0;t.style.transform='none'});t1.style.left='315px';t2.style.left='1250px'});
  $('typ').innerHTML='';$('slot').classList.remove('f');$('tgS').classList.remove('on');$('send').className='send';$('send').textContent='Send offer';
  orb.style.transform='scale(0)';orb.querySelector('svg').style.transform='';setTile('media/photos/yarn.jpg','Leftover yarn','','#fff url(media/sam.jpg) center/cover');
  cur.style.transition='none';cur.style.opacity=0;cur.style.transform='translate(960px,560px)';void cur.offsetWidth;cur.style.transition='';
}
async function loop(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('post').classList.add('hide');$('mark').classList.add('on');return}
  while(true){
    while(!visible||document.hidden)await sleep(300);
    reset();chap(1);await sleep(350);
    /* 1 · post: the line opens into a card */
    await go($('post'),.42);await click();
    $('post').classList.add('hide');show(1);morph('vC',640,240,30);await sleep(720);mv(away());await sleep(350);
    await type('Leftover yarn, 10 balls');await sleep(120);
    await go($('slot'));await click();$('slot').classList.add('f');await sleep(350);
    await go($('tgS'));await click();$('tgS').classList.add('on');await sleep(450);
    /* 2 · the card becomes a listing, a match slides in */
    chap(2);cur.style.opacity=0;bg('#FBE4D8');morph('vT',250,316,26,440);await sleep(1050);
    snap(function(){t1.style.opacity=1;show(0)});
    t2.style.transition=TT;t2.style.opacity=1;tileTo(t2,635);await sleep(650);
    orb.style.transform='scale(1)';await sleep(380);
    await go(orb);await click();orb.classList.add('p');
    /* 3 · swap */
    bg('#DFEBF2');orb.querySelector('svg').style.transform='rotate(180deg)';t1.style.transition=TT;tileTo(t1,635,4);tileTo(t2,315,-4);await sleep(200);orb.classList.remove('p');await sleep(800);
    /* 4 · both tiles fold into one offer */
    chap(3);cur.style.opacity=0;orb.style.transform='scale(0)';tileTo(t1,475);tileTo(t2,475);await sleep(750);
    setTile('media/photos/water.jpg','Watercolour set','M','#C98B6B');
    snap(function(){shape(250,316,26,600);view('vT',true);show(1);t1.style.opacity=0;t2.style.opacity=0});
    bg('#FAF7F2');morph('vO',560,300,30);await sleep(1150);
    await go($('send'));$('send').classList.add('pr');await click();$('send').classList.remove('pr');$('send').classList.add('d');$('send').textContent='Offer sent';await sleep(800);
    /* 5 · the offer becomes a notification */
    cur.style.opacity=0;bg('#F7ECCF');morph('vN',560,104,52);await sleep(1900);
    /* 6 · end */
    bg('#FAF7F2');card.classList.add('m');view('');shape(104,104,52);await sleep(500);show(0);card.classList.remove('m');$('mark').classList.add('on');await sleep(2200);
    $('mark').classList.remove('on');await sleep(450);
  }
}
loop();
</script>
</body>
</html>
