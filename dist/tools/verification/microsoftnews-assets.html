="og:site_name" content="TECHCOMMUNITY.MICROSOFT.COM" data-next-head=""/><link rel="canonical" href="https://techcommunity.microsoft.com/blog/microsoft365insiderblog/new-microsoft-365-icons-for-the-ai-era/4458674" data-next-head=""/><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":"https://techcommunity.microsoft.com","name":"Microsoft Community Hub"},{"@type":"ListItem","position":2,"item":"https://techcommunity.microsoft.com/category/communities","name":"Communities"},{"@type":"ListItem","position":3,"item":"https://techcommunity.microsoft.com/category/products-services","name":"Products"},{"@type":"ListItem","position":4,"item":"https://techcommunity.microsoft.com/category/microsoft365","name":"Microsoft 365"},{"@type":"ListItem","position":5,"item":"https://techcommunity.microsoft.com/category/microsoft365/blog/Microsoft365InsiderBlog","name":"Microsoft 365 Insider Blog"}]}</script><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"BlogPosting","datePublished":"10/16/2025, 5:46:51 PM","description":"Hi, Insiders! We are Jessica Hu and Priya Mehta, Product Managers on the Apple Ecosystem team. We are excited to share new, modern icons of Microsoft 365 apps, now available for Windows, Mac, Android, iOS, and the web.\nNew Microsoft 365 icons for the AI era\nMicrosoft Word, Excel, PowerPoint, and the rest of your trusted productivity tools have new life with Copilot in Microsoft 365 – and now their icons will show it! The newly designed app icons reflect a strategic shift in Microsoft 365: unified, intuitive, and designed for flow across every canvas. As Copilot connects Microsoft 365 apps into a single, intelligent experience, the icons embody that transformation with cleaner shapes, vibrant colors, and a connected design system nodding to Copilot’s influence.\n\nHow it works\n\nDownload or update Microsoft 365 Copilot, Word, Excel, PowerPoint, OneNote, Outlook, Designer, Clipchamp, OneDrive, Teams, SharePoint, Forms, Access, and Defender, and you’ll notice that these apps have a new, unique look!\n\nAvailability\nThe icons are rolling out in the coming weeks across desktop, web, and mobile for both individuals and organizations running:\n\nWindows: Version 2509 (Build 19231.20200) or later.\nMac: Version 16.102 (Build 25100710) or later.\nAndroid: Build 16.0.19328.20000 or later.\nWord, PowerPoint, and Excel for iOS: Version 2.102 (Build 25100611) or later.\nOffice Mobile for iOS: Version 2.102 (Build 25100730) or later.\nOneNote for iOS: Version 16.102 (Build 25100611) or later.\n\nLearn more about our new icons.\nFeedback\nLet us know what you think of Microsoft 365’s new icons! To share your thoughts, select Help &amp;gt; Feedback in your preferred app.\n&amp;nbsp;\nLearn about the&amp;nbsp;Microsoft 365 Insider program&amp;nbsp;and sign up for the&amp;nbsp;Microsoft 365 Insider newsletter&amp;nbsp;to get the latest information about Insider features in your inbox once a month!","mainEntityOfPage":{"@type":"WebPage","@id":"https://techcommunity.microsoft.com/blog/microsoft365insiderblog/new-microsoft-365-icons-for-the-ai-era/4458674"},"headline":"New Microsoft 365 icons for the AI era","image":["https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NDU4Njc0LTI1aHd6cQ?revision=12"],"dateModified":"10/16/2025, 5:39:23 PM","author":{"@type":"Person","name":"JessicaHu","url":"https://techcommunity.microsoft.com/t5/s/gxcuf89792/m_assets/avatars/default/avatar-12.svg?time=0"},"publisher":{"@type":"Organization","name":"TECHCOMMUNITY.MICROSOFT.COM"}}</script><noscript id="__next_css__DO_NOT_USE__"></noscript><script id="prism-bootstrap" data-nscript="beforeInteractive" crossorigin="anonymous">window.Prism = window.Prism || {};Prism.manual = true;</script><link rel="preload" href="/_next/static/css/8026d1d2a7baab8e.css" as="style" crossorigin="anonymous"/><li rozen":false,"showMoveIndicator":false,"moderationData":{"__ref":"ModerationData:moderation_data:4458674"},"teaser":"\u003cP\u003eThe newly designed app icons reflect a strategic shift in Microsoft 365: unified, intuitive, and designed for flow across every canvas.\u003c/P\u003e","body":"\u003cP\u003eHi, Insiders! We are Jessica Hu and Priya Mehta, Product Managers on the Apple Ecosystem team. We are excited to share new, modern icons of Microsoft 365 apps, now available for Windows, Mac, Android, iOS, and the web.\u003c/P\u003e\n\u003cH3 id=\"community-4458674-toc-hId--460157327\"\u003eNew Microsoft 365 icons for the AI era\u003c/H3\u003e\n\u003cP\u003eMicrosoft Word, Excel, PowerPoint, and the rest of your trusted productivity tools have new life with Copilot in Microsoft 365 – and now their icons will show it! The newly designed app icons reflect a strategic shift in Microsoft 365: unified, intuitive, and designed for flow across every canvas. As Copilot connects Microsoft 365 apps into a single, intelligent experience, the icons embody that transformation with cleaner shapes, vibrant colors, and a connected design system nodding to Copilot’s influence.\u003c/P\u003e\n\u003cspan class=\"lia-media-object lia-media-is-center lia-media-size-default\" data-image-alt=\"\"\u003e\u003cbutton class=\"lia-media-unstyled-btn\" type=\"button\" aria-haspopup=\"true\" aria-label=\"Enlarge Image\"\u003e\u003cimg src=\"https://techcommunity.microsoft.com/t5/s/gxcuf89792/images/bS00NDU4Njc0LVBmbnd4Nw?image-dimensions=999x562\u0026amp;revision=12\" width=\"999\" height=\"562\" alt=\"\" /\u003e\u003c/button\u003e\u003c/span\u003e\n\u003cH3 id=\"community-4458674-toc-hId-2027355506\"\u003eHow it works\u003c/H3\u003e\n\u003cUL\u003e\n\u003cLI\u003eDownload or update Microsoft 365 Copilot, Word, Excel, PowerPoint, OneNote, Outlook, Designer, Clipchamp, OneDrive, Teams, SharePoint, Forms, Access, and Defender, and you’ll notice that these apps have a new, unique look!\u003c/LI\u003e\n
