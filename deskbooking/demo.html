/* ===== CCO Desk Booking · flat, same tokens + type as the Knowledge Hub pages ===== */
:root{
 --blue:#3CB5E5;--blue-d:#1F8FBF;--green:#007E7A;--green-d:#005F5C;
 --gray:#555555;--mid:#696E70;--vgray:#747678;--lgray:#E6E7E8;--mgray:#BCBEC0;--line:#E4E6E8;--bg:#F5F6F7;--mint:#E9F5F4;--sky:#EAF6FC;--ink:#26302F;
 --r-panel:32px;--r-card:20px;--r-btn:14px;
 --shadow:0 4px 14px rgba(31,57,61,.08);--shadow-h:0 10px 24px rgba(31,57,61,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:#fff;color:var(--gray);font:15px/1.6 "Vale Sans","Vale Sans Web",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1 0 auto;padding:28px 0 64px}footer{flex-shrink:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 40px}
h1,h2,h3{font-style:italic;color:var(--green);font-weight:600;margin:0}
h2{font-size:30px;line-height:1.2}
.note,.empty{color:var(--mid)}
.empty{font-style:italic;margin:0}
.note{font-size:13px;margin:12px 0 0}

/* hero: flat Vale blue, white wording, green edge line (same as the Hub) */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:0 0 140px 0;padding:56px 56px 52px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--green)}
.hero h1{color:#fff;font-size:56px;line-height:1.05;margin:0 0 14px;font-weight:400}
.hero h1 em{font-weight:700;font-style:italic}
.hero .logo{align-self:flex-end;height:44px;width:auto}
.hero p{font-size:19px;font-style:italic;max-width:46ch;margin:0;line-height:1.5;color:#fff}

.err .dim{color:var(--mid);font-size:12.5px}
.err .t{font-weight:700}.err{margin-top:0;margin-bottom:22px;background:var(--sky);border-left:5px solid var(--blue);padding:14px 20px;font-size:14px;color:var(--ink)}

/* top bar: compact Vale-Blue header (replaces the big hero banner) */
.bar{position:sticky;top:0;z-index:30;background:var(--blue);box-shadow:0 4px 18px rgba(31,57,61,.14)}
.bar-in{max-width:1280px;margin:0 auto;padding:0 40px;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px 28px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:14px;min-width:0;padding:12px 0}
#logo{display:flex;align-items:center;flex:0 0 auto}
#logo:empty{display:none}
.ttl img{height:32px;width:auto}
.ttl .mk{display:none}
.ttl h1{color:#fff;font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.2px}
.ttl p{margin:3px 0 0;font-size:14px;font-style:italic;color:#fff}
.bar .tabs{margin-top:0;background:rgba(255,255,255,.2);padding:5px;border-radius:999px;gap:4px;flex-wrap:nowrap}
.bar .tab{border:0;background:none;color:#fff;padding:9px 20px}
.bar .tab:hover{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.bar .tab[aria-selected=true]{background:#fff;color:var(--green);box-shadow:0 2px 8px rgba(3,73,68,.18)}
.today{display:none}
.demo{display:inline-flex;align-items:center;background:#fff;color:var(--green);border-radius:999px;padding:3px 12px;font-size:13px;font-style:normal}
.demobar{max-width:1280px;margin:0 auto;padding:10px 40px 0;font-size:13px;color:var(--mid);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demobar button{border:0;background:none;color:var(--green);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.calkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mid)}
.calkey span{display:inline-flex;align-items:center;gap:6px}.calkey i{width:12px;height:12px;border-radius:0 0 4px 0;display:inline-block;border:1px solid var(--line)}
.calkey i.ok{background:var(--mint);border-color:#BFE0DD}.calkey i.low{background:var(--sky);border-color:var(--blue)}.calkey i.full{background:var(--bg)}
details.rulesw>summary{list-style:none;cursor:pointer;padding-bottom:16px}
details.rulesw>summary::-webkit-details-marker{display:none}
details.rulesw:not([open]){padding-bottom:0}
details.rulesw>summary h3:after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-4px 0 0 8px;transition:transform .2s}
details.rulesw[open]>summary h3:after{transform:rotate(225deg);margin-top:4px}
details.rulesw[open]>summary{padding-bottom:12px}
.repl{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-style:normal;font-weight:400;color:var(--ink);cursor:pointer}
.repl input{width:17px;height:17px;accent-color:var(--green);margin:0}
.repbox{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin:-4px 0 14px;padding:12px 14px;border:1px solid var(--line);background:var(--bg);border-radius:0 0 14px 0}
.repd,.repw{display:flex;gap:6px}
.repd button,.repw button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.repd button[aria-pressed=true],.repw button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.rephint{font-size:13px;color:var(--mid)}
table.mbt{table-layout:fixed}
table.mbt td{height:56px;padding-top:8px;padding-bottom:8px}
.tw table.mbt tbody tr:last-child td{padding-top:8px;padding-bottom:8px}
/* tabs = pills */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.tab{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.tab:hover{border-color:var(--green);color:var(--green)}
.tab[aria-selected=true]{background:var(--green);border-color:var(--green);color:#fff}
.pane{margin-top:0}

/* layout */
.cols2{display:grid;grid-template-columns:350px minmax(0,1fr);grid-template-areas:"side main" "rules rules";gap:22px 28px;align-items:start}
.side{grid-area:side;display:grid;gap:22px;align-content:start;min-width:0}
.side>.panel{margin-top:0!important}
.rulesw{grid-area:rules}
.main{grid-area:main;min-width:0}

/* panels */
.panel,.zone,.selhead,.tw{background:#fff;border:1px solid var(--line);border-radius:0 0 var(--r-panel) 0;box-shadow:var(--shadow)}
.panel,.zone{overflow:hidden}
.panel{padding:0 0 19px}
.panel+.panel{margin-top:22px}
.panel h3,.zone h3{background:none;color:var(--green);font-size:19px;padding:18px 22px 0;margin:0;display:flex;align-items:center;gap:10px}
.panel.g h3,.zone.z2 h3{background:none}
.panel>*:not(h3){margin-left:22px;margin-right:22px}
.panel h3+*{margin-top:20px}
.panel>ul,.panel>p{margin-top:0;margin-bottom:0}
.panel>*:last-child{margin-bottom:0}
.panel h3+ul,.panel h3+p{margin-top:20px}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-weight:700;font-size:14px}
.panel.g .n{color:#fff}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 26px 20px 24px;border-left:6px solid var(--green)}
.selhead h2{font-size:30px;font-weight:600}
.daybar{margin-bottom:24px}
.daybar .dact{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.daybar .dhint{font-size:14.5px;color:var(--mid)}
.main .steplab{margin-top:0}.main .legend{margin:0 2px 14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg)}
.stat.g{background:var(--green);border-color:var(--green);color:#fff}
.stat.b{background:#fff;border-color:var(--mgray);color:var(--ink)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 16px}

.legend i.rs{background:#8C9598}

.steplab .n{background:var(--green);color:#fff}
.zones{display:grid;gap:22px}
.zone .desks{padding:20px 22px 19px}
.desks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* buttons: same corner as home */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;border:0;cursor:pointer;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:0 0 var(--r-btn) 0;background:var(--green);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.btn.o{background:#fff;color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}.btn.o:hover{background:var(--mint)}
.btn.r{background:#fff;color:var(--gray);box-shadow:inset 0 0 0 1.5px #C4C8CB}.btn.r:hover{background:var(--bg)}
.btn:disabled{background:var(--line);color:#8B9093;cursor:not-allowed;box-shadow:none}
.btn.big{padding:12px 24px;font-size:14.5px}
.btn.sm{}

/* chips */
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;color:var(--ink);background:var(--bg);white-space:nowrap}
.chip.guest{background:#fff;border-color:var(--gray);color:var(--ink)}
.chip.info{background:var(--sky);border-color:var(--blue);color:var(--ink)}
.chip.ok{background:var(--mint);border-color:#BFE0DD;color:var(--green-d)}
.chip.bad{background:var(--bg);color:var(--mid)}

/* desks: coloured header with white wording.
   Booked = grey stripes · Your booking = blue stripes · Checked in = solid (no stripes) · Reserved = dark grey stripes */
.desk{--e:var(--green);display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:0 0 var(--r-card) 0;box-shadow:0 2px 8px rgba(31,57,61,.08);transition:box-shadow .16s ease,transform .16s ease}
.dh{background:var(--e);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14.5px}

.dh svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.db{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:92px}
.desk .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;line-height:1.3;min-height:21px}
.desk .sub{font-size:12.5px;color:var(--mid)}
.desk .acts{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.desk.free:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.desk.pend{--e:var(--vgray)}
.desk.pend .db{background:repeating-linear-gradient(135deg,#F2F3F4,#F2F3F4 8px,#E7E9EA 8px,#E7E9EA 16px)}
.desk.in{--e:var(--gray)}
.desk.in .db{background:#F2F3F4}
.desk.res{--e:#6E7375}
.desk.res .db{background:repeating-linear-gradient(135deg,#F2F3F4,#F2F3F4 8px,#E7E9EA 8px,#E7E9EA 16px)}
.desk.mine{--e:var(--blue)}
.desk.mine .db{background:var(--sky)}
.desk.free{cursor:pointer}
.desk.free.cant{cursor:default;--e:var(--green)}
.desk.free.cant:hover{box-shadow:0 2px 8px rgba(31,57,61,.08);transform:none}
.desk .why{font-size:12.5px;color:var(--mid);margin-top:auto;padding-top:8px}
.tk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;flex:0 0 auto}

.desk .who.free-t{color:var(--green-d)}

/* calendar */

.calh button:disabled{border-color:var(--line);color:#B5BBBF;cursor:not-allowed}
.calg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dwl{font-size:12px;font-weight:600;color:var(--mid);text-align:center}
.cc{height:54px;border-radius:0 0 12px 0;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0;background:#fff}
.cc b{font-size:16px;font-weight:600;color:var(--ink)}

.cc.off{background:var(--bg)}.cc.off b{color:#B0B6BA}
button.cc{cursor:pointer;font:inherit;transition:transform .12s ease,box-shadow .12s ease}

/* lists */
.plist{list-style:none;padding:0;display:grid;gap:10px}

.plist li:last-child{border-bottom:0;padding-bottom:0}
.plist small{color:var(--mid)}
.plist.cp{gap:0}

.plist.cp li:last-child{border-bottom:0;padding-bottom:0}
.plist.cp li:first-child{padding-top:0}
.plist.cp .pl{flex:1;min-width:0;flex-wrap:nowrap}
.plist.cp .pn{font-size:15px;gap:10px}
.plist.cp .chip{font-size:11px;padding:0 8px}
.av.md{width:30px;height:30px;font-size:11px}
.dk{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--mid);background:var(--bg);border-radius:999px;padding:1px 10px}
.ck{flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}

.ck.no{background:none}
.rules{padding-left:18px;font-size:14px;display:grid;gap:8px;color:var(--ink)}
.rulesw .rules{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 40px;padding-left:40px;padding-right:22px}

/* tables: green header with white italic */
.tw{overflow-x:auto}
.panel .tw{box-shadow:none;border-radius:0 0 var(--r-card) 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#F7F8F8;color:var(--mid);text-align:left;padding:10px 14px;font-weight:600;font-style:normal;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
tr:last-child td{border-bottom:0}
tr.td td{background:var(--sky)}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 8px}
.chips .empty{grid-column:1/-1}
.pp{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;background:#fff;color:var(--ink);white-space:nowrap}
.pp small{color:var(--mid);font-weight:600}
.pp.me{background:var(--blue);border-color:var(--blue);color:#fff}.pp.me small{color:#fff}
.pp.g{background:#fff;border-style:dashed;border-color:var(--mgray);color:var(--ink)}.pp.g small{color:var(--mid)}
.lead{color:var(--mid)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.ta{text-align:right;white-space:nowrap;padding-right:22px}.ta .btn+.btn{margin-left:8px}
.tw tbody tr:last-child td{padding-top:14px;padding-bottom:22px}
.tw tbody tr:last-child td.ta{padding-bottom:22px}
.tw td{vertical-align:middle}
.gap{margin-top:28px}

/* insights */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--blue),var(--shadow);border-radius:0 0 var(--r-card) 0;padding:18px 22px}
.kpi.g{box-shadow:inset 0 4px 0 var(--green),var(--shadow)}
.kpi .n{display:block;width:auto;height:auto;background:none;border-radius:0;font-size:34px;font-weight:600;font-style:italic;color:var(--green);line-height:1.1}
.kpi .l{font-weight:700;font-size:14.5px;color:var(--ink)}
.kpi .d{font-size:13px;color:var(--mid);margin-top:2px}
.wbars{display:grid;gap:12px}
.wb{display:grid;grid-template-columns:70px 1fr 150px;gap:14px;align-items:center;font-size:14px;color:var(--ink)}
.wb .tr{height:16px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}
.wb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.wb .tr b{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:0 0 var(--r-btn) 0;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
footer{border-top:1px solid var(--line)}
footer .tag b{font-weight:700}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-top:20px;padding-bottom:24px;font-size:12.5px;font-style:italic;color:var(--mid)}

/* ---- profile photos + profile card ---- */
.av{position:relative;overflow:hidden;flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--blue);color:#fff;font-weight:700;font-style:italic;font-size:12.5px;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#fff;opacity:0}
.av img.ok{opacity:1}
.av.m{background:var(--blue);box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--blue)}
.plist.cp li.me{background:var(--sky);border-radius:0 0 14px 0;margin:2px -10px;padding:8px 10px;border-bottom-color:transparent}
.plist.cp li.me .nm{color:var(--blue-d,#1F8FBF)}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.xl{width:76px;height:76px;font-size:26px}
.pn{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600;font-size:16px;color:var(--ink);max-width:100%;min-width:0}
.pn .nm{overflow-wrap:anywhere;line-height:1.25}
.pn:hover .nm{color:var(--green);text-decoration:underline}
.plist .pl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.plist .pl small{width:100%;margin-left:44px;margin-top:-4px}
button.pp{display:inline-flex;align-items:center;gap:8px;padding:2px 12px 2px 3px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;min-width:0;width:100%}
button.pp:hover{border-color:var(--green)}
button.pp.me:hover{filter:brightness(.95)}
.pp .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.pp small{margin-left:auto;flex:0 0 auto}
.btn.done{background:var(--mint);color:var(--green-d);box-shadow:inset 0 0 0 1.5px var(--green);cursor:default}
.btn.done:hover{background:var(--mint)}
.btn.off{background:var(--line);color:#8B9093;cursor:not-allowed;box-shadow:none}
.btn.off:hover{background:var(--line)}
.pop{position:absolute;z-index:60;width:340px;max-width:calc(100vw - 20px);background:#fff;border:1px solid var(--line);border-radius:0 0 var(--r-panel) 0;box-shadow:var(--shadow-h);overflow:hidden}
.pop .x{position:absolute;right:10px;top:8px;width:32px;height:32px;display:grid;place-items:center;border:0;background:none;font-size:24px;line-height:1;color:var(--mid);cursor:pointer;padding:0 0 3px}
.pop .x:hover{color:var(--green)}
.pop .ph{display:flex;gap:16px;align-items:center;padding:22px 34px 12px 22px}
.pop .ph .pic{position:relative;flex:0 0 auto}
.pop h4{margin:0;font-style:italic;font-weight:600;color:var(--green);font-size:23px;line-height:1.15;overflow-wrap:anywhere}
.pop .tt{display:block;margin-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink);line-height:1.35}
.pop .pact{display:flex;gap:4px;padding:2px 16px 14px}
.pop .pact a,.pop .pact button{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--green);cursor:pointer;text-decoration:none}
.pop .pact a:hover,.pop .pact button:hover{background:var(--mint)}
.pop .pact svg,.pop .x svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pop .pact svg{width:20px;height:20px}
.pop .bx{margin:0 18px 18px;border:1px solid var(--line);border-radius:0 0 var(--r-card) 0;padding:14px 16px;display:grid;gap:12px;font-size:14px;color:var(--ink)}
.pop .bx .k{display:block;font-size:12px;font-weight:700;color:var(--mid);margin-bottom:2px}
.pop .bx b{font-weight:600}
.pop .ml{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.pop .ml:hover{color:var(--green);text-decoration:underline}
.pop .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* every desk card is the same fixed size, whatever its state (booking or checking in never moves the grid) */
@media(min-width:641px){
 .desk{height:170px}
 .desk .db{min-height:0;overflow:hidden}
 .desk .who{flex-wrap:nowrap;min-width:0}
 .desk .who .pn{min-width:0;overflow:hidden}
 .desk .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}

}

@media(max-width:1000px){.cols2{grid-template-columns:1fr;grid-template-areas:"cal" "extra" "main" "rules"}.side{display:contents}.cal{grid-area:cal}.extra{grid-area:extra}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:44px}}
@media(max-width:640px){.daybar .dact{justify-content:flex-start}.daybar .dact .btn{width:100%}.bar-in{padding:10px 18px 12px;min-height:0}.ttl{padding:4px 0 0}.ttl h1{font-size:21px}.ttl p{display:none}.bar .tabs{width:100%;overflow-x:auto}.bar .tab{padding:8px 14px}.rulesw .rules{grid-template-columns:1fr}.wrap{padding:0 18px}main{padding-top:24px}.hero{padding:40px 24px;border-radius:0 0 70px 0}.hero h1{font-size:36px}.hero p{font-size:17px}.desks{grid-template-columns:1fr;gap:8px}.db{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px}.desk .acts{margin:0 0 0 auto;padding:0}.desk .why{margin:0;padding:0;flex-basis:100%}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.cc{height:48px}.wb{grid-template-columns:56px 1fr}.wb span:last-child{grid-column:1/-1}.panel,.zone,.selhead,.tw{border-radius:0 0 24px 0}.selhead h2{font-size:26px}.wk thead{display:none}.wk,.wk tbody{display:block}.wk tr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}.wk td{display:block;padding:0;border:0;background:transparent!important;box-shadow:none!important}.wk td:last-child{grid-column:1/-1}.wk tr.td{background:var(--sky)}.chips{grid-template-columns:1fr}}

<body>
<header class="bar"><div class="bar-in">
  <div class="ttl"><span class="demo">Demo</span><span id="logo"></span><div><h1>CCO Toronto desk booking</h1></div></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="book" aria-selected="true">Book a desk</button>
    <button class="tab" role="tab" data-v="week" aria-selected="false">Who's in</button>
    <button class="tab" role="tab" data-v="mine" aria-selected="false">My bookings</button>
    <button class="tab" role="tab" data-v="ins" aria-selected="false">Insights</button>
  </div>
</div></header>
<div class="demobar"><span>Demo with sample data and made-up colleagues. Nothing here is saved to SharePoint.</span><button type="button" id="dreset">Reset demo</button></div>
<main><div class="wrap">
  <div id="banner"></div>
  <section class="pane" id="pane"></section>
</div></main>
<footer><div class="wrap"><span>Vale Base Metals · CCO Toronto desk booking · Internal use</span><span class="tag">#EnergyTransitionMetals</span></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
/* ============ SETTINGS (edit here) ============ */
const CONFIG={
  siteUrl:"https://example.sharepoint.com/sites/demo",   // SharePoint site that holds the "Desk Bookings" list
  listTitle:"Desk Bookings",     // SharePoint list that stores the bookings
  windowDays:30,                 // how many days ahead people can book (change this number to open or close the window)
  releaseTime:"10:00",           // not checked in by this time = desk is released to others
  guestSameDayOnly:true,         // people not on the CCO roster can only book for today
  sameDayGraceMinutes:60,        // booked on the day? check in within this many minutes or the desk reopens
  maxUpcomingPerPerson:5,        // stops one person holding many future days
  admins:["Justin Dao"],
  photoBase:"",  // where profile photos come from (same photos as Outlook and Teams)
  logoUrl:""    // link to the official white (negative) Vale logo from the intranet Brand page. It shows in the top bar. Leave empty to hide. Never redraw the logo.
};
const SITE=(()=>{try{if(/\.sharepoint\.com$/i.test(location.hostname)){const m=location.pathname.match(/^\/(teams|sites)\/[^\/]+/i);if(m)return location.origin+m[0]}}catch(e){}return CONFIG.siteUrl.replace(/\/$/,"")})();
const DESKS=[
  {id:"01",z:"A"},{id:"02",z:"A"},{id:"03",z:"A"},{id:"04",z:"A"},{id:"05",z:"A"},{id:"06",z:"A",res:"Maya Chen"},
  {id:"07",z:"B"},{id:"08",z:"B"},{id:"09",z:"B",res:"Tom Nguyen"},{id:"10",z:"B"},{id:"11",z:"B"},{id:"12",z:"B",res:"Kenji Sato"}

const SP={
  kind:"sharepoint",
  base:SITE,
  async req(path,opt){
    const o=Object.assign({credentials:"same-origin"},opt||{});
    o.headers=Object.assign({"Accept":"application/json;odata=verbose"},o.headers||{});
    const r=await fetch(this.base+path,o);

    return r.status===204?null:r.json();
  },
  get L(){return "/_api/web/lists/getbytitle('"+encodeURIComponent(CONFIG.listTitle)+"')"},
  async digest(){const j=await this.req("/_api/contextinfo",{method:"POST"});return j.d.GetContextWebInformation.FormDigestValue},
  async init(){
    const me=await this.req("/_api/web/currentuser?$select=Title,Email,LoginName");
    const t=await this.req(this.L+"?$select=ListItemEntityTypeFullName");
    this.type=t.d.ListItemEntityTypeFullName;

    while(url){const j=await this.req(url.replace(this.base,""));(j.d.results||[]).forEach(x=>out.push(this.map(x)));url=j.d.__next||null}
    return out;
  },
  async add(b){
    const dg=await this.digest();
    const j=await this.req(this.L+"/items",{method:"POST",headers:{"Content-Type":"application/json;odata=verbose","X-RequestDigest":dg},
      body:JSON.stringify({__metadata:{type:this.type},Title:"Desk "+b.desk+" | "+b.date,Desk:b.desk,BookingDate:b.date,BookedBy:b.name,BookedByEmail:b.email,Status:"Booked",IsCCO:b.cco?"Yes":"No"})});

  }

/* ===== DEMO DATA: sample activity with made-up colleagues (deterministic) ===== */
function demoSeed(){
  let r=20261111;const rnd=()=>{r|=0;r=r+0x6D2B79F5|0;let t=Math.imul(r^r>>>15,1|r);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const others=ROSTER.filter(p=>p.n!=="Justin Dao");
  const guests=[{n:"Alex Rivera",e:"alex.rivera@example.com"},{n:"Jordan Lee",e:"jordan.lee@example.com"},{n:"Morgan Price",e:"morgan.price@example.com"}];
  const out=[];let id=1;const t=today(),tp=parse(t);
  const at=(d,h,m)=>{const x=parse(d);x.setHours(h,m,0,0);return x.toISOString()};
  for(let k=-42;k<=CONFIG.windowDays;k++){
    const d=addDays(tp,k),ds=ymd(d);if(isWeekend(d))continue;
    const wd=d.getDay();const base={1:4,2:7,3:8,4:7,5:3}[wd];
    const fade=k>0?Math.max(0.15,1-k/22):1;
    let n=Math.round(base*fade+(rnd()*2-1));n=Math.max(0,Math.min(n,bookable.length));
    const desks=bookable.map(x=>x.id).sort(()=>rnd()-.5).slice(0,n);
    const used=new Set();
    desks.forEach((desk,ix)=>{
      let p;
      if(k<=0&&ix===0&&rnd()<.55&&!used.has("Justin Dao"))p={n:"Justin Dao",e:"justin.dao@vale.com",c:true};
      else if(rnd()<.07){const g=pick(guests);p={n:g.n,e:g.e,c:false}}
      else{let q;do{q=pick(others)}while(used.has(q.n));p={n:q.n,e:q.e,c:true}}
      if(used.has(p.n))return;used.add(p.n);
      const b={id:id++,desk,date:ds,name:p.n,email:p.e,status:"Booked",checkIn:null,cco:p.c,created:at(ymd(addDays(d,-1-Math.floor(rnd()*6))),9+Math.floor(rnd()*8),Math.floor(rnd()*60))};
      if(k<0){const x=rnd();if(x<.08)b.status="Cancelled";else if(x<.80)b.checkIn=at(ds,8,Math.floor(rnd()*95));}
      if(k===0&&p.n!=="Justin Dao"&&rnd()<.6)b.checkIn=at(ds,8,Math.floor(rnd()*50));
      out.push(b);
    });
  }
  /* you: today booked (not yet checked in) + a few upcoming days */
  const mine=[0,1,6,8].map(k=>windowDates()[k]).filter(Boolean);
  mine.forEach(ds=>{if(out.some(b=>b.date===ds&&b.name==="Justin Dao"&&b.status!=="Cancelled"))return;
    const taken=new Set(out.filter(b=>b.date===ds&&b.status!=="Cancelled").map(b=>b.desk));
    const desk=["03","05","02","10"].find(x=>!taken.has(x))||bookable.map(x=>x.id).find(x=>!taken.has(x));if(!desk)return;
    out.push({id:id++,desk,date:ds,name:"Justin Dao",email:"justin.dao@vale.com",status:"Booked",checkIn:(ds===t&&nowMin()>=relMin)?at(ds,9,12):null,cco:true,created:at(ymd(addDays(tp,-2)),14,5)})});
  if(nowMin()>=relMin)out.forEach(b=>{if(b.name==="Justin Dao"&&b.date===t&&b.status!=="Cancelled"&&!b.checkIn)b.checkIn=at(t,9,12)});
  return out;
}

let store=Local,me={name:"You",email:""},data=[],view="book",sel=null,loadError="",spError="";
const today=()=>ymd(new Date());
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function windowDates(){const out=[];const t=parse(today());for(let i=0;i<=CONFIG.windowDays;i++){const d=addDays(t,i);if(!isWeekend(d))out.push(ymd(d))}return out}

/* A booking is: Booked, In (checked in), Released (today, past cut-off, no check-in), No-show (past day, no check-in), Cancelled */
function state(b){
  if(b.status==="Cancelled")return "Cancelled";
  if(b.checkIn)return "In";
  const t=today();
  if(b.date<t)return "No-show";
  if(b.date===t&&nowMin()>=cutoffMin(b))return "Released";
  return "Booked";
}
/* check-in deadline in minutes. Booked on the day itself? You get sameDayGraceMinutes from booking (or releaseTime if later). */
function cutoffMin(b){
  const c=b.created?new Date(b.created):null;
  if(c&&!isNaN(c)&&ymd(c)===b.date){return Math.max(relMin,c.getHours()*60+c.getMinutes()+CONFIG.sameDayGraceMinutes)}
  return relMin;
}
const graceTxt=()=>{const g=CONFIG.sameDayGraceMinutes;return g%60===0?(g/60===1?"1 hour":g/60+" hours"):g+" minutes"};
const hhmm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const active=b=>{const s=state(b);return s==="Booked"||s==="In"};
function holder(desk,date){
  return data.filter(b=>b.desk===desk&&b.date===date&&active(b)).sort((a,b)=>(a.id-b.id))[0]||null;
}
const isMine=b=>b&&(norm(b.email)&&norm(b.email)===norm(me.email)||norm(b.name)===norm(me.name));
const myActiveOn=date=>data.find(b=>b.date===date&&active(b)&&isMine(b));
const upcomingMine=()=>data.filter(b=>b.date>=today()&&active(b)&&isMine(b));
async function reload(){

  try{data=await store.list(from,to);loadError=""}catch(e){loadError=e.message}
}

function whyNot(desk,date){
  const d=parse(date);
  if(date<today())return "Past date";
  if(isWeekend(d))return "Weekends are closed";
  if(date>maxDate())return "You can book up to "+CONFIG.windowDays+" days ahead (through "+longDate(lastBookable())+")";
  if(myActiveOn(date))return "You already have a desk this day";
  if(!treatAsCCO(me)&&CONFIG.guestSameDayOnly&&date!==today())return "Non-CCO colleagues can book same-day only";
  if(date>today()&&upcomingMine().length>=CONFIG.maxUpcomingPerPerson)return "You have "+CONFIG.maxUpcomingPerPerson+" upcoming bookings. Cancel one first";
  return "";
}
async function book(desk,date){
  const w=whyNot(desk,date);if(w){toast(w);return}
  if(holder(desk,date)){toast("Someone just booked that desk");await refresh();return}
  try{
    const rec=await store.add({desk,date,name:me.name,email:me.email,status:"Booked",checkIn:null,cco:treatAsCCO(me)});
    await reload();
    const first=holder(desk,date);
    if(first&&first.id!==rec.id){await store.update(rec.id,{status:"Cancelled"});await reload();toast("Desk "+desk+" was taken a moment ago. Pick another.")}
    else toast("Desk "+desk+" booked for "+longDate(date));
  }catch(e){toast("Could not save: "+e.message)}
  render();
}
async function cancel(id){
  const b=data.find(x=>x.id===id);if(!b)return;
  if(!isMine(b)){toast("Only the person who booked can cancel");return}
  try{await store.update(id,{status:"Cancelled"});await reload();toast("Booking cancelled. The desk is free again.")}catch(e){toast("Could not save: "+e.message)}
  render();
}
async function checkin(id){
  const b=data.find(x=>x.id===id);if(!b||!isMine(b))return;
  if(b.date!==today()){toast("You can check in on the day");return}
  try{await store.update(id,{checkIn:new Date().toISOString()});await reload();toast("Checked in. Enjoy your day!")}catch(e){toast("Could not save: "+e.message)}
  render();
}
async function refresh(){await reload();render()}

function dayCounts(date){
  let booked=0,inn=0;bookable.forEach(d=>{const h=holder(d.id,date);if(h){booked++;if(state(h)==="In")inn++}});
  return {booked,inn,free:bookable.length-booked};
}
let calM=null;
const monthStart=dt=>{const d=parse(dt);return new Date(d.getFullYear(),d.getMonth(),1)};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function maxDate(){return ymd(addDays(parse(today()),CONFIG.windowDays))}
function lastBookable(){const w=windowDates();return w[w.length-1]||today()}
function nextWorkday(){const w=windowDates();return w.find(x=>x>today())||today()}

function deskTile(d,date){
  const num="Desk "+d.id;
  const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(d.res)return `<div class="desk res"><div class="dh"><span>${num}</span><small>Reserved</small></div><div class="db"><div class="who">${esc(d.res)}</div><div class="sub">Permanently assigned</div></div></div>`;
  const h=holder(d.id,date);
  if(h){
    const s=state(h),mine=isMine(h),isIn=s==="In";
    const cls=mine?"mine":(isIn?"in":"pend");
    const chip=h.cco?"":`<span class="chip guest">Guest</span>`;
    const sub=(!isIn&&date===today())?`<div class="sub">Check in by ${hhmm(cutoffMin(h))}</div>`:"";
    let acts="";
    if(mine){
      if(s==="Booked"&&date===today())acts+=`<button class="btn sm" type="button" data-a="in" data-id="${h.id}">Check in</button>`;
    }
    const lab=isIn?`${TICK}Checked in`:(mine?"Your desk":"Booked");
    const tick=isIn?avatar(h.name,h.email,"sm"+(mine?" m":"")):"";
    return `<div class="desk ${cls}"><div class="dh"><span>${num}</span><small>${lab}</small></div><div class="db"><div class="who">${tick}${pn0(h)}${chip}</div>${sub}<div class="acts">${acts}</div></div></div>`;
  }
  const rel=data.find(b=>b.desk===d.id&&b.date===date&&state(b)==="Released");
  const w=whyNot(d.id,date);
  /* a released desk is simply free again: no name, no message */
  /* free but you can't book it: keep it looking free, say why once (or not at all if you already have a desk that day) */
  if(w)return `<div class="desk free cant"><div class="dh"><span>${num}</span><small>Available</small></div><div class="db"><div class="who free-t">Free all day</div>${myActiveOn(date)?"":`<div class="why">${esc(w)}</div>`}</div></div>`;

function calendarHtml(){
  if(!calM)calM=monthStart(sel);
  const y=calM.getFullYear(),m=calM.getMonth(),last=new Date(y,m+1,0),t=today(),mx=maxDate();
  let start=addDays(new Date(calM),-((calM.getDay()+6)%7));
  let rows="";
  for(let w=0;;w++){
    const ws=addDays(start,w*7);if(ws>last)break;
    let row="",any=false;
    for(let k=0;k<5;k++){
      const d=addDays(ws,k);
      if(d.getMonth()!==m){row+=`<span class="cc blank"></span>`;continue}
      any=true;const s=ymd(d);
      if(s<t||s>mx){row+=`<span class="cc off"><b>${d.getDate()}</b></span>`;continue}
      const c=dayCounts(s);const cls=c.free===0?"full":c.free<=3?"low":"ok";
      row+=`<button type="button" class="cc ${cls}${s===t?" td":""}" data-date="${s}" aria-pressed="${s===sel}" aria-label="${longDate(s)}, ${c.free} desks free"><b>${d.getDate()}</b><small>${c.free===0?"Full":c.free+" free"}</small></button>`;
    }
    if(any)rows+=row;
  }
  const prevOk=new Date(y,m,0)>=parse(t),nextOk=new Date(y,m+1,1)<=parse(mx);
  return `<div class="calh"><button type="button" data-a="mprev" aria-label="Previous month" ${prevOk?"":"disabled"}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><b>${MONTHS[m]} ${y}</b><button type="button" data-a="mnext" aria-label="Next month" ${nextOk?"":"disabled"}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="calg">${["Mon","Tue","Wed","Thu","Fri"].map(x=>`<span class="dwl">${x}</span>`).join("")}${rows}</div>
  <div class="calkey"><span><i class="ok"></i>Plenty free</span><span><i class="low"></i>3 or fewer</span><span><i class="full"></i>Full</span></div>`;
}

function vWeek(){
  const dates=windowDates();
  const shown=dates.filter(dt=>dt===today()||bookable.some(d=>holder(d.id,dt)));
  const hidden=dates.length-shown.length;
  const rows=shown.map(dt=>{
    const list=bookable.map(d=>holder(d.id,dt)).filter(Boolean).sort((a,b)=>a.desk<b.desk?-1:1);
    const c=dayCounts(dt);
    const ppl=list.length?list.map(b=>`<button type="button" class="pp${isMine(b)?" me":(b.cco?"":" g")}" data-pop="${esc(b.email||"")}" data-name="${esc(b.name)}" data-pdate="${dt}">${avatar(b.name,b.email,"sm")}<span class="pt">${esc(b.name)}</span><small>D${b.desk}</small></button>`).join(""):`<span class="empty">No bookings yet</span>`;
    return `<tr${dt===today()?' class="td" title="Today"':""}><td style="white-space:nowrap"><b>${longDate(dt)}</b></td><td style="white-space:nowrap">${c.booked} / ${bookable.length}</td><td><div class="chips">${ppl}</div></td></tr>`}).join("");
  return `<div class="dayhead"><h2>Who's in</h2></div>
  <p class="lead" style="margin:0 0 14px;color:var(--mid)">Everyone planning to come in over the next ${CONFIG.windowDays} days.</p>
  <div class="tw"><table class="wk"><thead><tr><th>Day</th><th>Booked</th><th>People</th></tr></thead><tbody>${rows}</tbody></table></div>${hidden?`<p class="note">${hidden} ${hidden===1?"day has":"days have"} no bookings yet and ${hidden===1?"is":"are"} hidden.</p>`:""}`;
}
function outcome(b){const s=state(b);return s==="In"?`<span class="chip ok">Checked in</span>`:s==="No-show"?`<span class="chip bad">No check-in</span>`:s==="Released"?`<span class="chip bad">Released</span>`:s==="Cancelled"?`<span class="chip">Cancelled</span>`:`<span class="chip info">Booked</span>`}
function vMine(){

  const up=mineAll.filter(isUp).sort((a,b)=>a.date<b.date?-1:1);
  const past=mineAll.filter(b=>!isUp(b)).sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
  const upRow=b=>{const td=b.date===today();
    return `<tr${td?' class="td"':""}><td style="white-space:nowrap"><b>${longDate(b.date)}</b></td><td>Desk ${b.desk}</td><td>${outcome(b)}</td><td class="ta">${td&&state(b)==="Booked"?`<button class="btn sm" type="button" data-a="in" data-id="${b.id}">Check in</button>`:""}${state(b)!=="In"?`<button class="btn r sm" type="button" data-a="cancel" data-id="${b.id}">Cancel</button>`:""}</td></tr>`};
  const pastRow=b=>`<tr><td style="white-space:nowrap"><b>${longDate(b.date)}</b></td><td>Desk ${b.desk}</td><td>${outcome(b)}</td><td></td></tr>`;
  const cols=`<colgroup><col style="width:26%"><col style="width:20%"><col style="width:22%"><col></colgroup>`;
  return `<div class="dayhead"><h2>My bookings</h2><span class="stat">${up.length} of ${CONFIG.maxUpcomingPerPerson} upcoming used</span></div>
  <div class="tw"><table class="mbt">${cols}<thead><tr><th>Day</th><th>Desk</th><th>Status</th><th></th></tr></thead><tbody>${up.length?up.map(upRow).join(""):`<tr><td colspan="4"><span class="empty">No upcoming bookings. Pick a day in Book a desk.</span></td></tr>`}</tbody></table></div>

  <div class="tw"><table class="mbt">${cols}<thead><tr><th>Day</th><th>Desk</th><th>Outcome</th><th></th></tr></thead><tbody>${past.length?past.map(pastRow).join(""):`<tr><td colspan="4"><span class="empty">Nothing yet.</span></td></tr>`}</tbody></table></div>`;
}
function vIns(){
  const t=today(),from=ymd(addDays(parse(t),-30));
  const rng=data.filter(b=>b.date>=from&&b.date<=t&&b.status!=="Cancelled");
  const done=rng.filter(b=>{const s=state(b);return s==="In"||s==="No-show"||s==="Released"});
  const inn=done.filter(b=>state(b)==="In").length,ns=done.length-inn;
  const guests=rng.filter(b=>!b.cco).length;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const kpi=(n,l,d,g)=>`<div class="kpi${g?" g":""}"><div class="n">${n}</div><div class="l">${l}</div><div class="d">${d}</div></div>`;
  /* by weekday */
  const wd=[1,2,3,4,5].map(w=>{const days={};data.filter(b=>b.date>=from&&b.date<t&&b.status!=="Cancelled"&&parse(b.date).getDay()===w).forEach(b=>{(days[b.date]=days[b.date]||{b:0,i:0}).b++;if(b.checkIn)days[b.date].i++});
    const ks=Object.keys(days);const ab=ks.length?ks.reduce((s,k)=>s+days[k].b,0)/ks.length:0,ai=ks.length?ks.reduce((s,k)=>s+days[k].i,0)/ks.length:0;return {w,ab,ai,n:ks.length}});
  const bars=wd.map(x=>`<div class="wb"><b>${DOW[x.w]}</b><div class="tr"><i style="width:${Math.min(100,x.ab/bookable.length*100)}%"></i><b style="width:${Math.min(100,x.ai/bookable.length*100)}%"></b></div><span>${x.ab.toFixed(1)} booked · ${x.ai.toFixed(1)} in</span></div>`).join("");
  let who="";
  if(isAdmin(me)){
    const g={};done.forEach(b=>{const k=norm(b.email)||norm(b.name);const o=g[k]=g[k]||{n:b.name,e:b.email,t:0,ns:0,c:b.cco};o.t++;if(state(b)!=="In")o.ns++});
    const top=Object.keys(g).map(k=>g[k]).filter(o=>o.ns>0).sort((a,b)=>b.ns-a.ns||b.t-a.t).slice(0,10);
    who=`<div class="panel g" style="margin-top:22px"><h3>Most bookings without check-in (admin only)</h3>${top.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Bookings</th><th>No check-in</th><th>Share</th></tr></thead><tbody>${top.map(o=>`<tr><td>${pname({name:o.n,email:o.e,date:t})}${o.c?"":` <span class="chip guest">Guest</span>`}</td><td>${o.t}</td><td>${o.ns}</td><td>${pct(o.ns,o.t)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">No missed check-ins recorded.</p>`}
    
    <div class="row" style="margin-top:12px"><button class="btn o big" type="button" data-a="csv">Export bookings (CSV)</button></div></div>`;
  }
  return `<div class="dayhead"><h2>Insights</h2><span class="stat">Last 30 days</span></div>
  <div class="kpis">
   ${kpi(rng.length,"Bookings","Not cancelled, last 30 days")}
   ${kpi(pct(inn,done.length),"Checked in",inn+" of "+done.length+" finished bookings",true)}
   ${kpi(pct(ns,done.length),"No check-in",ns+" bookings released or missed")}
   ${kpi(guests,"Non-CCO bookings",pct(guests,rng.length)+" of bookings",true)}
  </div>
  <div class="panel"><h3>Average desks used by weekday (of ${bookable.length})</h3><div class="legend" style="margin:12px 22px 14px"><span><i style="background:var(--blue)"></i>Booked</span><span><i style="background:var(--green)"></i>Checked in</span></div><div class="wbars">${bars}</div></div>
  ${who}`;
}

  if(pn){if(popEl&&popEl._for===pn){closePop();return}openPop(pn);if(popEl)popEl._for=pn;return}
  if(popEl&&e.target.closest(".pop .x")){closePop();return}
  if(popEl&&!e.target.closest(".pop"))closePop();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-date],.tab");if(!t)return;
  if(t.classList.contains("tab")){view=t.dataset.v;render();return}
  if(t.dataset.date){sel=t.dataset.date;calM=monthStart(sel);render();return}
  const a=t.dataset.a;
  if(a==="book")book(t.dataset.d,sel);
  else if(a==="why")toast(t.dataset.w);
  else if(a==="auto"){const f=bookable.find(d=>!holder(d.id,sel));if(f)book(f.id,sel);else toast("No desks left on this day")}
  else if(a==="mprev"){calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()}
  else if(a==="mnext"){calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()}
  else if(a==="cancel")cancel(+t.dataset.id);
  else if(a==="in")checkin(+t.dataset.id);
  else if(a==="csv")exportCsv();
});
document.addEventListener("click",e=>{if(e.target.id==="dreset"){demoReset();reload().then(render);toast("Demo data reset")}});
(async function start(){
  store=Local;Local.key="cco_desk_demo_"+today();me={name:"Justin Dao",email:"justin.dao@vale.com"};
  if(!Local.all().length)Local.save(demoSeed());
  await reload();if(CONFIG.logoUrl)$("#logo").innerHTML=`<img src="${esc(CONFIG.logoUrl)}" alt="Vale">`;render();
  setInterval(()=>{if(!document.hidden&&!popEl)refresh()},60000);
})();
})();
