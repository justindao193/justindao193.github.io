<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TStar App Prototype</title>
<meta name="description" content="High-fidelity TStar prototype: a low-pressure way to make friends in a big university cohort.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F4FA; --card:#FFFFFF; --ink:#15173A; --muted:#6A6D8C; --line:#E8E7F1;
  --night:#1C1F5E; --night-2:#2C3192; --blue:#4F6BFF; --blue-soft:#EEF1FF;
  --star:#FFC43D; --star-soft:#FFF4D6; --star-ink:#3B2A00; --mint:#22A867; --rose:#FF6B7D;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(21,23,58,.05),0 8px 24px -12px rgba(21,23,58,.18);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#E9E8F2;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
.device{position:relative;width:100%;height:100dvh;overflow:hidden;overflow:clip;background:var(--bg)}
@media (min-width:520px) and (min-height:640px){
  body{display:grid;place-items:center;min-height:100dvh;padding:24px}
  .device{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;box-shadow:0 0 0 10px #111327,0 0 0 11px #2a2d4a,0 40px 80px -20px rgba(21,23,58,.45)}
}
body.embed{background:var(--bg);padding:0;display:block}
body.embed .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}

/* status bar */
.status{position:absolute;inset:0 0 auto 0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:4px 28px 0 34px;font-size:15px;font-weight:700;z-index:40;pointer-events:none;color:var(--ink);transition:color .3s}
.status.light{color:#fff}
.status .icons{display:flex;gap:6px;align-items:center}
.status svg{display:block}

/* screens */
.stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:47px 0 110px;scrollbar-width:none;will-change:transform}
.screen::-webkit-scrollbar{display:none}
.screen.no-tab{padding-bottom:28px}
.screen.enter{transform:translateX(100%)}
.screen.enter.go{transform:none;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.screen.leave{transform:translateX(-28%);opacity:.6;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.screen.enter-back{transform:translateX(-28%);opacity:.6}
.screen.enter-back.go{transform:none;opacity:1;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.screen.leave-back{transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.screen.fade{opacity:0}.screen.fade.go{opacity:1;transition:opacity .25s}

.pad{padding:0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;min-height:52px}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn.ghost{background:transparent;box-shadow:none}
.navbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:6px 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.navbar .title{text-align:center;font-weight:700;font-size:16px}
.navbar .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}

.h2{display:flex;justify-content:space-between;align-items:baseline;margin:26px 20px 12px}
.h2 b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.h2 button{font-size:13.5px;font-weight:600;color:var(--blue)}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px #DDF4E8}

/* avatars */
.av{flex:none;border-radius:50%;display:grid!important;place-items:center;font-weight:800;color:#fff!important;white-space:nowrap!important;overflow:visible!important;letter-spacing:-.02em;position:relative}
.av .on{position:absolute;right:0;bottom:0;width:28%;height:28%;border-radius:50%;background:var(--mint);border:2.5px solid #fff}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:999px;font-weight:700;font-size:16px;transition:transform .15s,opacity .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-star{background:var(--star);color:var(--star-ink);box-shadow:0 10px 24px -10px rgba(230,160,0,.8),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn-blue{background:var(--night);color:#fff;box-shadow:0 10px 24px -12px rgba(28,31,94,.8)}
.btn-soft{background:var(--blue-soft);color:var(--night-2)}
.btn-text{height:44px;color:var(--muted);font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none;box-shadow:none}
.dock{position:sticky;bottom:-110px;margin-bottom:-110px;padding:14px 20px 136px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.dock small{display:block;text-align:center;color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.4}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;padding:8px 10px 26px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30;transition:transform .3s}
.tabbar.hide{transform:translateY(110%)}
.tab{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:#9A9CB5}
.tab.on{color:var(--night)}
.tab .ic{position:relative}
.tab .badge{position:absolute;top:-3px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--rose);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px}
.hello small{display:block;color:var(--muted);font-size:13.5px;font-weight:500}
.hello b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.cohort-tag{margin:6px 20px 0;padding:0;display:block;font-size:14px;font-weight:600;color:var(--night-2)}
.rocket{margin:18px 20px 0;padding:18px;border-radius:26px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 100% 0%,#3A40B8 0%,var(--night) 55%,#14164A 100%)}
.rocket .stars{position:absolute;inset:0;opacity:.7;pointer-events:none}
.rocket .row{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.rocket .label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B9BDF7}
.rocket .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.rocket .big span{font-size:15px;font-weight:600;color:#B9BDF7}
.rocket .rinfo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.flight{position:relative;height:54px;margin:16px 0 6px}
.flight .trail{position:absolute;left:0;right:30px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(255,255,255,.12)}
.flight .trail i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,rgba(255,196,61,0),#FFC43D)}
.flight .ship{position:absolute;top:50%;width:58px;height:33px;margin-top:-16px;margin-left:-16px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.flight .ship svg,.flight .moonbig svg{width:100%;height:100%;display:block}
.flight .moonbig{position:absolute;right:-6px;top:50%;width:54px;height:54px;margin-top:-27px}
.track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.14)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#FFDF7E,var(--star));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.track .moon{position:absolute;right:-14px;top:50%;width:36px;height:36px;margin-top:-18px}
.track .moon svg{width:100%;height:100%;display:block}
.rocket .foot{position:relative;font-size:13px;color:#B9BDF7;font-weight:600}
.rocket .help{position:relative;margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:999px}


.quests{display:grid;gap:10px;padding:0 20px}
.quest{display:flex;align-items:center;gap:14px;padding:12px;text-align:left;width:100%}
.quest .thumb{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none;display:grid;place-items:center;font-size:26px}
.quest .thumb img,.quest .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.qcard .img svg{width:100%;height:100%;display:block}
.quest .t{flex:1;min-width:0}
.quest .t b{display:block;font-size:15.5px;font-weight:700}
.quest .t span{font-size:13px;color:var(--muted)}
.pts{display:inline-flex;align-items:center;gap:4px;background:var(--star-soft);color:#7A5600;font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.done-chip{background:#E3F6EC;color:#157A49}

.suggest{margin:0 20px;padding:16px;display:flex;gap:14px;align-items:center;width:calc(100% - 40px);text-align:left}
.suggest b{display:block;font-size:15.5px}
.suggest span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.suggest .why svg{flex:none;display:block}.suggest .why{display:inline-flex;align-items:center;gap:5px;line-height:1.2;margin-top:8px;font-size:12px;font-weight:700;color:var(--night-2);background:var(--blue-soft);border-radius:999px;padding:4px 9px}

/* directory */
.search{margin:6px 20px 0;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15.5px}
.chips{display:flex;gap:8px;padding:14px 20px 4px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--night);color:#fff;border-color:var(--night)}
.people{display:grid;gap:10px;padding:10px 20px}
.person{display:flex;gap:14px;align-items:center;padding:14px;text-align:left;width:100%}
.person .t{flex:1;min-width:0}
.person b{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.person .t>span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.person .t>.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:inherit}
.person .t>.tags .tag{background:#F1F0F7}
.person .t>.tags .tag.match{background:var(--star-soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#F1F0F7;color:#45486B}
.tag.match{background:var(--star-soft);color:#7A5600}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}

/* profile */
.cover{height:150px;margin:-47px 0 0;position:relative;background:radial-gradient(120% 140% at 80% 0%,#8FA3FF 0%,var(--blue) 40%,var(--night-2) 100%);overflow:hidden}
.cover .stars{position:absolute;inset:0;opacity:.8}
.cover .navbar{position:absolute;inset:47px 0 auto 0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.cover .iconbtn{background:rgba(255,255,255,.2);box-shadow:none;color:#fff;backdrop-filter:blur(8px)}
.prof-head{padding:0 20px;margin-top:-48px;position:relative}
.prof-head .av{border:5px solid var(--bg)}
.prof-head h2{margin:10px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.prof-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.prof-sec{margin:14px 20px 0;padding:18px}
.prof-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prof-sec p{margin:0;font-size:15px;line-height:1.55}
.ask{background:var(--star-soft);box-shadow:none}
.ask p{font-weight:600;color:#5A4000}
.qrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.qcard{flex:none;width:132px}
.qcard .img{height:96px;border-radius:14px;overflow:hidden;background:#EEE}
.qcard .img img{width:100%;height:100%;object-fit:cover}
.qcard b{display:block;font-size:13px;margin-top:6px}
.qcard span{font-size:12px;color:var(--muted)}

/* sheet */
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(14,15,40,0);transition:background .3s,visibility 0s .4s;pointer-events:none;visibility:hidden;overflow:hidden}
.overlay.show{background:rgba(14,15,40,.45);pointer-events:auto;visibility:visible;transition:background .3s}
.sheet{width:100%;background:var(--card);border-radius:30px 30px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow-y:auto}
.overlay.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#DAD9E6;margin:0 auto 14px}
.sheet h3{margin:6px 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:center}
.sheet .lead{margin:0 auto 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:300px}
.field{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:14px;font-size:15px;outline:0;resize:none;background:#FBFBFE;transition:border-color .2s}
.field:focus{border-color:var(--blue)}
.prompts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.prompt{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--blue-soft);color:var(--night-2);text-align:left}
.sheet .btn+.btn{margin-top:6px}
.bigstar{width:84px;height:84px;margin:4px auto 8px;display:grid;place-items:center;border-radius:28px;background:var(--star-soft)}
.opt{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:18px;border:1.5px solid var(--line);text-align:left;margin-bottom:10px;background:#fff}
.opt:hover{border-color:var(--blue)}
.opt .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--night-2);flex:none}
.opt b{display:block;font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.explain{display:grid;gap:12px;margin:20px 0 18px}
.explain div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.explain i{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;background:var(--star-soft)}

/* burst */
.burst{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(28,31,94,.92),rgba(14,15,40,.96));opacity:0;pointer-events:none;transition:opacity .25s;color:#fff;text-align:center}
.burst.show{opacity:1;pointer-events:auto}
.burst .core{transform:scale(.4);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.burst.show .core{transform:none}
.burst h3{font-size:28px;font-weight:800;margin:18px 0 6px;letter-spacing:-.02em}
.burst p{margin:0 auto;color:#C9CCF7;font-size:15px;max-width:260px;line-height:1.5}
.spark{position:absolute;left:50%;top:45%;width:10px;height:10px;margin:-5px;opacity:0}
.burst.show .spark{animation:fly .9s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.burst .btn{width:260px;margin:26px auto 0}
.burst .track{width:260px;margin:22px auto 0}

/* chat */
.chat{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.sys{align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#7A5600;background:var(--star-soft);padding:6px 12px;border-radius:999px;margin:6px 0}
.time{align-self:center;font-size:12px;color:var(--muted);margin-top:6px}
.bub{max-width:78%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.4;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.bub.me{align-self:flex-end;background:var(--night);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.typing{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B6B8CF;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.compose{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 28px;background:rgba(245,244,250,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:6}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.quick button{flex:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;height:46px;border-radius:999px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:15px;outline:0}
.send{width:46px;height:46px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;flex:none}

/* quest detail */
.qhero{height:300px;margin-top:-47px;position:relative;overflow:hidden;color:#fff}
.qhero img{width:100%;height:100%;object-fit:cover}
.qhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,15,40,.45) 0%,transparent 35%,rgba(14,15,40,.85) 100%)}
.qhero .navbar{position:absolute;inset:47px 0 auto 0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;z-index:2}
.qhero .iconbtn{background:rgba(255,255,255,.2);box-shadow:none;color:#fff;backdrop-filter:blur(8px)}
.qhero .txt{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.qhero h2{margin:8px 0 4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.qhero p{margin:0;color:#E4E5FA;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 0}
.stats div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);line-height:1.3}
.stats b{display:block;font-size:17px;font-weight:800}
.stats span{font-size:12px;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:12px;padding:18px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--night-2);font-weight:800;font-size:13px;display:grid;place-items:center}
.post{margin:0 20px 12px;padding:14px}
.post .who{display:flex;gap:10px;align-items:center}
.post .who b{font-size:14px}
.post .who span{display:block;font-size:12px;color:var(--muted)}
.post .who .stack-av{display:flex!important;flex:none}
.post .stack-av .av{border:2px solid #fff;margin-left:-10px}
.post .stack-av .av:first-child{margin-left:0}
.post p{margin:10px 0 0;font-size:14.5px;line-height:1.45}
.post .ph{margin-top:10px;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.post .ph img{width:100%;height:100%;object-fit:cover}
.post .acts{display:flex;gap:16px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:600}
.post .acts span{display:inline-flex;align-items:center;gap:5px}

/* code / scan */
.codebox{margin:12px 20px 0;padding:24px;text-align:center}
.codebox svg{width:200px;height:200px;margin:0 auto;display:block}
.code{margin-top:14px;font-size:26px;font-weight:800;letter-spacing:.12em}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 20px 0;padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.joined{background:#E3F6EC;color:#157A49;box-shadow:none;animation:pop .35s}
.cam{margin:-47px 0 0;height:calc(100% + 75px);min-height:600px;position:relative;background:radial-gradient(100% 80% at 50% 40%,#3a3b52,#0d0e1c);color:#fff}
.cam .navbar{position:absolute;inset:47px 0 auto 0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.cam .navbar .title{color:#fff}
.cam .iconbtn{background:rgba(255,255,255,.15);box-shadow:none;color:#fff}
.frame{position:absolute;left:50%;top:44%;width:240px;height:240px;margin:-120px 0 0 -120px}
.frame b{position:absolute;width:44px;height:44px;border:4px solid var(--star)}
.frame b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.frame b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.frame b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.frame b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.frame .line{position:absolute;left:14px;right:14px;height:2px;background:var(--star);box-shadow:0 0 12px var(--star);animation:scan 1.6s ease-in-out infinite}
.frame .ghost{position:absolute;inset:40px;opacity:.25}
@keyframes scan{0%,100%{top:16px}50%{top:220px}}
.cam .hint{position:absolute;left:24px;right:24px;bottom:120px;text-align:center;font-size:15px;color:#E4E5FA}
.cam .found{position:absolute;left:20px;right:20px;bottom:40px;padding:14px;border-radius:20px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px;transform:translateY(160%);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.cam .found.show{transform:none}
.cam .found .t{flex:1}
.cam .found b{display:block}
.cam .found span{font-size:13px;color:var(--muted)}
.cam .found .btn{width:auto;height:44px;padding:0 18px;font-size:14.5px}

/* share */
.photo-pick{margin:4px 20px 0;height:230px;border-radius:22px;border:2px dashed #CFCDE0;display:grid;place-items:center;text-align:center;color:var(--muted);background:#FBFBFE;overflow:hidden;position:relative}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .row{display:flex;gap:10px;justify-content:center;margin-top:12px}
.photo-pick .row button{height:40px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:700;font-size:13.5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.photo-pick .swap{position:absolute;right:12px;bottom:12px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);font-weight:700;font-size:13px}
.lbl{display:block;margin:20px 20px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.lbl em{font-style:normal;font-weight:500}
.buds{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px}
.bud{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.bud.add{padding:5px 12px;background:none;box-shadow:none;border:1.5px dashed #CFCDE0;color:var(--muted)}

/* feed */
.feed-top{padding:0 20px 6px}
.qotd{margin:12px 20px 16px;padding:16px;background:linear-gradient(135deg,var(--blue-soft),#FFF6DF)}
.qotd small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--night-2)}
.qotd b{display:block;font-size:17px;margin-top:6px}
.new{outline:3px solid var(--star);outline-offset:-3px;animation:pop .45s}

/* inbox, me */
.row-item{display:flex;gap:14px;align-items:center;padding:14px 20px;width:100%;text-align:left}
.row-item+.row-item{border-top:1px solid var(--line)}
.row-item .t{flex:1;min-width:0}
.row-item b{display:block;font-size:15.5px}
.row-item span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item time{font-size:12px;color:var(--muted);align-self:flex-start;margin-top:3px}
.unread{width:10px;height:10px;border-radius:50%;background:var(--blue)}

.toast{position:absolute;left:50%;top:58px;z-index:70;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- QR ---------- */
function qr(color){var n=25,c=color||'#15173A',s='',r=248;function rnd(){r=(r*1103515245+12345)%2147483648;return r/2147483648}
  function finder(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" rx="1.6" fill="none" stroke="'+c+'" stroke-width="1"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" rx=".6" fill="'+c+'"/>'}
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){var inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(inF)continue;if(x>9&&x<15&&y>9&&y<15)continue;if(rnd()>.52)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" rx=".25" fill="'+c+'"/>'}
  return '<svg viewBox="-1 -1 27 27" aria-label="Quest code">'+finder(.5,.5)+finder(n-7.5,.5)+finder(.5,n-7.5)+s+'<g transform="translate(9.5 9.5)"><rect width="6" height="6" rx="1.6" fill="#FFC43D"/><g transform="translate(.9 .9) scale(.175)">'+star(24,'#15173A').replace(/<svg[^>]*>|<\/svg>/g,'')+'</g></g></svg>'}

var stackEl=$('#stack'),tabbar=$('#tabbar'),statusEl=$('#status');
var TABS=[['home','Home','home'],['cohort','Cohort','cohort'],['moments','Moments','moments'],['inbox','Inbox','chat'],['me','Me','me']];
function renderTabs(){
  tabbar.innerHTML=TABS.map(function(t){var badge=t[0]==='inbox'?'<span class="badge">1</span>':'';
    return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'" data-t="tab-'+t[0]+'" aria-label="'+t[1]+'"><span class="ic">'+ic(t[2],25,S.tab===t[0]?2.2:1.8)+badge+'</span>'+t[1]+'</button>'}).join('');
}
function key(){return S.stack.length?S.stack[S.stack.length-1]:S.tab}
function build(k){var parts=k.split(':'),name=parts[0],arg=parts[1];
  var el=document.createElement('div');el.className='screen';el.dataset.k=k;
  el.innerHTML=R[name](arg);
  var root=['home','cohort','moments','inbox','me'].indexOf(name)>-1;
  if(!root) el.classList.add('no-tab');
  tabbar.classList.toggle('hide',!root);
  statusEl.classList.toggle('light',['profile','quest','scan'].indexOf(name)>-1);
  return el}
function show(dir){
  var old=stackEl.lastElementChild,el=build(key());
  if(!old||dir==='none'){stackEl.innerHTML='';stackEl.appendChild(el);after(el);return}
  el.classList.add(dir==='back'?'enter-back':dir==='fade'?'fade':'enter');
  stackEl.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.classList.add('go');
    if(dir==='push') old.classList.add('leave'); else if(dir==='back'){old.style.zIndex=2;old.classList.add('leave-back')}
  })});
  setTimeout(function(){if(old.parentNode)old.remove();el.classList.remove('enter','enter-back','fade','go')},420);
  after(el);
}
function push(k){S.stack.push(k);show('push')}
function back(){if(S.stack.length){S.stack.pop();show('back')}}
function tab(t){S.tab=t;S.stack=[];renderTabs();show('fade')}
function after(el){var k=el.dataset.k;
  if(k==='code'){setTimeout(function(){var w=$('#wait',el);if(!w)return;S.buddy='mina';w.className='wait joined';w.innerHTML=av(people.mina,28)+' Mina joined your quest '+ic('check',18,2.4);$('#codeNext',el).disabled=false},2200)}
  if(k==='scan'){setTimeout(function(){S.buddy='mina';var f=$('#found',el);if(f)f.classList.add('show')},1800)}
  if(k.indexOf('chat:')===0){var id=k.split(':')[1];chatUI(el,id);scrollChat(el)}
  if(k==='cohort'){var q=$('#q',el);q.addEventListener('input',function(){S.q=q.value;$('#people',el).innerHTML=peopleList()})}
}

document.getElementById('device').addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-tab],[data-filter],[data-note]');if(!t)return;
  if(t.dataset.note){$('#note').value=t.dataset.note;return}
  if(t.dataset.filter){S.filter=t.dataset.filter;var sc=stackEl.lastElementChild;sc.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.dataset.filter===S.filter)});$('#people',sc).innerHTML=peopleList();return}

  if(t.dataset.go){push(t.dataset.go);return}
  var a=t.dataset.act;
  if(a==='back')back();
  else if(a==='toast')toast(t.dataset.msg);
  else if(a==='points')pointsSheet();
  else if(a==='close')closeSheet();
  else if(a==='star')starSheet(t.dataset.id);
  else if(a==='sendstar'){var id=t.dataset.id,note=($('#note').value||'').trim();S.starred[id]=true;S.chat[id]=note?[{me:true,t:note}]:[];closeSheet();
    setTimeout(function(){burst(star(64,'#FFC43D')+'<h3>Star sent!</h3><p>'+people[id].name.split(' ')[0]+' gets it next time they open TStar.</p>',1500,function(){S.stack[S.stack.length-1]='profile:'+id;S.stack.push('chat:'+id);show('push');
      if(note){var el=stackEl.lastElementChild;S.chat[id].replied=true;setTimeout(function(){var log=$('#chatlog',el);if(!log)return;log.insertAdjacentHTML('beforeend',bubble({typing:true}));scrollChat(el)},900);setTimeout(function(){var ty=$('#typing',el);if(ty)ty.remove();var r='Hi Sherry, nice to meet you! :)';S.chat[id].push({me:false,t:r});var log=$('#chatlog',el);if(log){log.insertAdjacentHTML('beforeend',bubble({t:r}));scrollChat(el)}},2600)}
    })},260)}
  else if(a==='complete')completeSheet();
  else if(a==='toCode'){closeSheet();setTimeout(function(){push('code')},200)}
  else if(a==='toScan'){closeSheet();setTimeout(function(){push('scan')},200)}
  else if(a==='toShare'){closeSheet();S.buddy='mina';setTimeout(function(){push('share')},200)}
  else if(a==='photo'){S.photo=true;var k=key();refresh()}
  else if(a==='unphoto'){S.photo=false;refresh()}
  else if(a==='post'){S.caption=($('#cap')||{}).value||'';S.questDone=true;S.newPost=true;var from=S.points;S.points+=14;
    burst(star(60,'#FFC43D')+'<h3>+7 Star Points</h3><p>+14 for the cohort rocket.</p><div class="track"><i id="bt" style="width:'+(from/S.goal*100)+'%"></i><span class="moon">'+MOON+'</span></div><div style="margin-top:8px;font-size:13px;color:#B9BDF7;font-weight:600" id="bn">'+from+' / '+S.goal+'</div><button class="btn btn-star" data-act="seeMoments" data-t="see-moments">See it in Moments</button>');
    setTimeout(function(){var bt=$('#bt');if(bt)bt.style.width=(S.points/S.goal*100)+'%';var bn=$('#bn');if(bn)bn.textContent=S.points+' / '+S.goal},450)}
  else if(a==='seeMoments'){$('#burst').classList.remove('show');S.tab='moments';S.stack=[];renderTabs();show('fade')}
});
function refresh(){var old=stackEl.lastElementChild,top=old.scrollTop,el=build(key());stackEl.replaceChild(el,old);el.scrollTop=top;after(el)}

/* ---------- start ---------- */
var h=(location.hash||'').replace('#','');
renderTabs();
if(h==='cohort'||h==='moments'||h==='inbox'||h==='me'){S.tab=h;renderTabs()}
else if(h==='profile'){S.stack=['profile:aj']}
else if(h==='quest'){S.stack=['quest']}
show('none');
window.TStar={go:function(k){push(k)},tab:tab,state:S};
})();
</script>
</body>
